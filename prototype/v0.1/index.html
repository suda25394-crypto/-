<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f9f5ff">
  <title>双生宇宙 · 情侣 AI 空间原型 V0.1</title>
  <style>
    :root{--ink:#322d4c;--muted:#8e88a4;--purple:#775fe6;--pink:#ff89b1;--surface:#ffffffd9;--line:#ffffffbf;--soft:#f2eeff;--shadow:0 16px 45px rgba(82,62,141,.12)}
    *{box-sizing:border-box}html{font-family:ui-rounded,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;color:var(--ink);background:#f6f4fc}body{margin:0;min-height:100vh}
    button,input,textarea{font:inherit}button{cursor:pointer;-webkit-tap-highlight-color:transparent}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #a39af7;outline-offset:2px}
    .site{min-height:100vh;display:flex;align-items:center;justify-content:center;gap:65px;padding:28px;background:radial-gradient(circle at 14% 20%,#fde2f2,transparent 36%),radial-gradient(circle at 82% 66%,#dfd7ff,transparent 34%),#f8f6fd}
    .introcopy{width:335px;max-width:35vw}.introcopy .eyebrow{letter-spacing:.23em;text-transform:uppercase;color:#a58cd5;font-size:12px;font-weight:800}.introcopy h1{font-size:46px;letter-spacing:-.06em;line-height:1.16;margin:19px 0}.introcopy h1 span{color:#836ce3}.introcopy p{color:#706985;line-height:1.85;font-size:15px}.introcopy .check{font-size:13px;color:#746b98;margin-top:21px}
    .phone{position:relative;width:min(430px,100%);height:min(860px,calc(100dvh - 56px));min-height:610px;overflow:hidden;border-radius:38px;background:linear-gradient(153deg,#fefbff,#eeeafc 80%);box-shadow:0 28px 90px #7868b333,0 0 0 1px #ffffffaa inset;isolation:isolate}
    .phone:before{content:"";position:absolute;z-index:-1;inset:0;background:radial-gradient(circle at 75% 14%,#fff8,transparent 25%),radial-gradient(circle at 10% 80%,#fee2ef6b,transparent 40%)}
    #app{height:100%;overflow:auto;scrollbar-width:none}#app::-webkit-scrollbar{display:none}.page{min-height:100%;padding:29px 23px 114px;position:relative}.full{min-height:100%;padding:32px 25px 28px;display:flex;flex-direction:column}
    .topline{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.brand{display:flex;align-items:center;gap:7px;font-weight:800;font-size:18px;letter-spacing:-.03em}.brandmark{display:grid;place-items:center;height:30px;width:30px;border-radius:11px;background:linear-gradient(135deg,#a290ff,#ffabd1);color:#fff;box-shadow:0 5px 12px #a799df60}.tiny{font-size:11px;color:var(--muted)}
    .chip{display:inline-flex;gap:5px;align-items:center;border:1px solid #ffffffbe;padding:8px 11px;border-radius:30px;background:#ffffff95;font-size:12px;color:#756a94}.chip.active{background:linear-gradient(120deg,#e2dbff,#ffe2ec);border-color:#bca9f8;color:#5140a4;font-weight:700}
    .glass{background:var(--surface);border:1px solid var(--line);border-radius:23px;box-shadow:var(--shadow);backdrop-filter:blur(15px)}.softcard{background:#fff9;border:1px solid #fff;border-radius:21px}
    h1,h2,h3,p{margin-top:0}h1{font-size:31px;line-height:1.27;letter-spacing:-.05em}h2{font-size:21px;letter-spacing:-.035em;margin:0 0 8px}h3{font-size:15px;margin:0 0 5px}.bodytext{color:#706985;line-height:1.8;font-size:13px}.sub{color:var(--muted);font-size:12px;line-height:1.65}
    .primary{width:100%;padding:16px 18px;border:0;color:white;border-radius:17px;background:linear-gradient(115deg,#8871ec,#b084f5 53%,#ea9ed2);font-weight:800;box-shadow:0 12px 25px #a490e151;display:flex;align-items:center;justify-content:center;gap:10px}.primary:active{transform:translateY(1px)}.secondary{border:1px solid #d9d0fa;background:#fffafc;color:#6654c6;border-radius:15px;padding:12px 15px;font-weight:700}
    .textbtn{background:transparent;border:0;color:#8b7cc5;font-size:12px;text-decoration:underline;text-underline-offset:3px;padding:8px}.pill{display:inline-flex;padding:8px 13px;background:#ffffffae;border:1px solid #ffffffd8;border-radius:30px;font-size:12px;color:#7f70a7}
    .space{flex:1}.center{text-align:center}.cosmic{position:relative;height:310px;display:flex;align-items:center;justify-content:center;margin-top:10px;overflow:visible}.cosmic.big{height:335px}
    .orbit-ring{position:absolute;width:280px;height:206px;border:1px solid #c4bcff88;border-radius:50%;transform:rotate(-24deg)}.orbit-ring.second{height:275px;width:256px;transform:rotate(39deg);border-color:#facbe485}
    .planet{width:187px;height:187px;position:relative;border-radius:50%;background:radial-gradient(circle at 29% 22%,#fff4fd,#eed8ff 21%,#9a8beb 55%,#655ac9 92%);box-shadow:inset -22px -24px 35px #4b47a56c,inset 7px 8px 22px #fff9,0 25px 38px #a99bdf80,0 0 55px #c8bdff8c;animation:float 6s ease-in-out infinite}
    .planet:before{content:"";position:absolute;inset:35% -22%;border:11px solid #ffdeedb8;border-left-color:#fff2ffdf;border-right-color:#b7a1e6b0;border-radius:50%;transform:rotate(-23deg);box-shadow:0 3px 5px #7f74cd22}.planet .land{position:absolute;top:53%;left:23%;width:98px;height:44px;border-radius:50% 50% 45% 55%;background:linear-gradient(40deg,#88d8c9,#b6f5df);transform:rotate(-18deg);filter:blur(.4px);box-shadow:inset -8px -5px 15px #53a9ae60}.planet .house{position:absolute;top:40%;left:47%;font-size:38px;transform:rotate(12deg);filter:drop-shadow(0 5px 3px #453e8c33)}
    .spark{position:absolute;color:#fff;filter:drop-shadow(0 0 3px #fff);animation:twinkle 2s ease-in-out infinite alternate}.p1{top:18px;left:22%}.p2{right:6%;top:31%;animation-delay:.8s}.p3{bottom:26%;left:7%;animation-delay:.4s}.p4{bottom:8%;right:28%;animation-delay:1.1s}.moon{position:absolute;display:grid;place-items:center;width:46px;height:46px;border-radius:50%;background:linear-gradient(140deg,#fff8ec,#ffcce4);box-shadow:inset -6px -7px 14px #f9a9c055,0 10px 23px #ba9bd64f;font-size:24px;top:32px;right:6%;animation:float 7s ease-in-out infinite reverse}.moon.small{width:35px;height:35px;top:auto;right:auto;left:7%;bottom:37px;background:linear-gradient(150deg,#f9e1ff,#c8e7ff);font-size:18px}
    .stage-title{font-size:30px;font-weight:850;letter-spacing:-.055em;line-height:1.24;margin:8px 0}.eyebrow{color:#8d7ece;font-size:11px;letter-spacing:.15em;font-weight:800}.hero-sub{color:#857b9b;font-size:13px;line-height:1.9}
    .scene-tag{display:inline-flex;align-items:center;gap:6px;padding:8px 13px;background:#ffffffa8;border:1px solid white;border-radius:20px;color:#7369a0;font-size:12px}
    .field{margin:14px 0}.field label{display:block;font-size:12px;color:#695d90;font-weight:800;margin-bottom:7px}.field input,.field textarea{width:100%;padding:13px 14px;background:#ffffffd5;border:1px solid #e5dff5;border-radius:14px;color:var(--ink);resize:vertical}.field input::placeholder,.field textarea::placeholder{color:#aca4ba}.twocol{display:grid;grid-template-columns:1fr 1fr;gap:10px}.tip{font-size:11px;color:#8f88a3;line-height:1.7}.choicegrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.choicegrid .chip{justify-content:center;padding:11px 5px;white-space:nowrap}
    .screenhead{display:flex;justify-content:space-between;align-items:center;gap:10px}.avatar{width:34px;height:34px;display:grid;place-items:center;border-radius:12px;background:#fff9;border:1px solid #fff;font-size:19px}.smalltitle{font-size:24px;font-weight:850;letter-spacing:-.05em;margin-top:7px}.row{display:flex;gap:9px;align-items:center}.between{justify-content:space-between}.sectiontitle{display:flex;justify-content:space-between;align-items:center;margin:22px 0 12px}.sectiontitle h3{font-size:16px;margin:0}.sectiontitle span{font-size:11px;color:#9b91ac}
    .worldview{height:313px;border-radius:27px;position:relative;overflow:hidden;background:radial-gradient(circle at 78% 22%,#f8f0ff,transparent 42%),linear-gradient(145deg,#dbd7ff,#e7eaff 52%,#f9e2f0);border:1px solid #fff;box-shadow:0 12px 27px #a6a0d846}.worldview .cosmic{transform:scale(.77);height:262px;margin-top:-2px}.worldview .worldtop{position:absolute;left:19px;top:17px;z-index:2}.worldview .worldtop strong{display:block;font-size:17px;margin-bottom:4px}.worldview .worldbottom{position:absolute;bottom:15px;left:14px;right:14px;display:flex;align-items:center;justify-content:space-between;z-index:2}.worldview .worldbottom .chip{background:#fffdf7b8}
    .taglist{display:flex;gap:6px;flex-wrap:wrap}.featuregrid{display:grid;grid-template-columns:1fr 1fr;gap:11px}.feature{min-height:116px;padding:17px 14px;text-align:left;border:1px solid #fff;background:#ffffffbc;border-radius:20px;box-shadow:0 7px 15px #8d83b41c;display:flex;flex-direction:column;gap:5px;color:var(--ink)}.feature .emo{font-size:25px}.feature strong{font-size:14px}.feature small{font-size:11px;color:#978da6;line-height:1.5}.feature:active{transform:scale(.98)}
    .ai-card{border-radius:22px;padding:17px;background:linear-gradient(120deg,#ffffffde,#f9e9ffde);border:1px solid #fff;box-shadow:0 9px 25px #9b8acf22}.ai-orb{width:35px;height:35px;border-radius:50%;background:radial-gradient(circle at 30% 30%,#fff,#ac9aff 65%,#8e79df);box-shadow:0 0 16px #bca5f6a7;flex:none;display:grid;place-items:center;color:#fff}.ai-body{line-height:1.8;color:#72658d;font-size:12px;margin:10px 0 12px}
    .navbar{position:absolute;left:13px;right:13px;bottom:10px;height:66px;border-radius:22px;background:#fffffff0;border:1px solid #fff;box-shadow:0 8px 28px #8877b92b;display:flex;align-items:center;justify-content:space-around;padding:5px 9px;z-index:7;backdrop-filter:blur(18px)}.navbtn{background:transparent;border:0;color:#a2a0b1;display:flex;flex-direction:column;gap:4px;align-items:center;font-size:10px;padding:8px 16px;border-radius:15px;min-width:76px}.navbtn span{font-size:19px;line-height:1.1}.navbtn.active{color:#755ee2;background:#f0eafe;font-weight:800}
    .wish{display:flex;align-items:flex-start;gap:11px;background:#fff9;padding:14px;border-radius:16px;border:1px solid #fff;margin-bottom:9px}.wish .symbol{width:40px;height:40px;border-radius:14px;display:grid;place-items:center;background:#f0eaff;font-size:21px;flex:none}.wish .content{flex:1;min-width:0}.wish strong{font-size:13px;display:block;word-break:break-word}.wish small{font-size:11px;color:#948aa7;display:block;margin:4px 0 10px}.mini-btn{border:0;border-radius:10px;background:#eae3ff;color:#6c57cc;font-size:11px;padding:9px 12px;font-weight:800}.muted-btn{background:#f8eafa;color:#a46b9d}
    .story{font-size:13px;line-height:2;color:#68607b}.story strong{color:#6655b7}.todo{display:flex;align-items:start;gap:10px;margin:14px 0;font-size:13px;line-height:1.6;color:#675e80}.todo .n{width:25px;height:25px;flex:none;display:grid;place-items:center;background:#eee8ff;border-radius:10px;color:#745add;font-size:12px;font-weight:800}
    .overlay{position:absolute;inset:0;background:#51476875;backdrop-filter:blur(7px);z-index:10;display:flex;align-items:flex-end}.sheet{width:100%;background:linear-gradient(155deg,#fff,#f6f1ff);border-radius:29px 29px 0 0;padding:24px 25px max(27px,env(safe-area-inset-bottom));max-height:85%;overflow:auto;box-shadow:0 -12px 55px #40396a33}.sheet-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:11px}.close{border:0;background:#f1edfc;border-radius:12px;width:34px;height:34px;color:#7a6ca0;font-size:20px}
    .empty{text-align:center;background:#fff9;border-radius:20px;padding:26px 16px;color:#877f9b;font-size:12px;line-height:1.9}.caption{font-size:10px;color:#9b93a9;text-align:center;line-height:1.7;padding:12px 10px}.note{background:#fdf1f9;padding:13px;border-radius:14px;color:#8a6081;line-height:1.7;font-size:12px}.btnrow{display:flex;gap:9px}.btnrow>button{flex:1}.hidden{display:none}
    @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-13px)}}@keyframes twinkle{from{opacity:.2;transform:scale(.7)}to{opacity:1;transform:scale(1.16)}}
    @media(max-width:790px){.site{padding:0;display:block;background:#f9f6fe}.introcopy{display:none}.phone{height:100dvh;min-height:0;width:100%;border-radius:0;box-shadow:none}.page{padding-top:max(23px,env(safe-area-inset-top))}.full{padding-top:max(25px,env(safe-area-inset-top))}.navbar{bottom:max(9px,env(safe-area-inset-bottom))}}
    @media(max-width:355px){.full{padding:22px 17px}.page{padding-left:15px;padding-right:15px}.stage-title{font-size:27px}.cosmic.big{height:285px}.planet{transform:scale(.9)}.navbar{left:8px;right:8px}.navbtn{min-width:70px;padding:8px 10px}}
    @media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
  </style>
</head>
<body>
<div class="site"><aside class="introcopy"><div class="eyebrow">LOVE, REIMAGINED</div><h1>不止记录恋爱。<br><span>一起创造宇宙。</span></h1><p>一个以 AI 为核心的双人空间。它记住你们愿意分享的故事，把回忆变成星球，把心愿变成行动，把日子变成只有你们才懂的风景。</p><div class="check">✦ 免费体验原型　✦ 无需账号　✦ 数据仅留在本机浏览器</div><p class="tiny" style="margin-top:32px">概念 V0.1 · AI 行为目前为本地规则模拟，未接入真实模型</p></aside><main class="phone"><div id="app"></div><div id="modal"></div></main></div>
<script>
(()=>{
'use strict';
const KEY='twin-universe-v01';
const empty=()=>({stage:'intro',step:0,a:'',b:'',memory:'',vibe:'温柔治愈',wish:'',interests:['✨ 惊喜灵感','🪐 双人宇宙'],memories:[],wishes:[],tab:'world',seenLetter:false});
let s=empty();try{const saved=JSON.parse(localStorage.getItem(KEY)||'null');if(saved && typeof saved==='object')s={...empty(),...saved}}catch(e){}
const app=document.getElementById('app'),modal=document.getElementById('modal');
const esc=x=>String(x??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(s))}catch(e){}};
const vibeIcons={'温柔治愈':'🌷','古灵精怪':'🪄','冒险探索':'🧭','平淡幸福':'☕'};
const place=x=>/海|沙滩|岛|浪|水/.test(x)?['潮汐星','🏖️','海风吹过的小岛']:/校|食堂|上课|大学|教室/.test(x)?['初遇星','🏫','藏着青春的校园']:/猫|狗|宠物/.test(x)?['茸茸星','🐱','住着毛茸茸朋友的星球']:/吃|饭|餐|奶茶|蛋糕/.test(x)?['甜心星','🍰','空气里有甜香的小镇']:['心动星','🏠','你们故事诞生的地方'];
const worldInfo=()=>place(s.memory||s.memories[0]||'');
const planet=(big=false)=>{const wi=worldInfo();return `<div class="cosmic ${big?'big':''}"><div class="orbit-ring"></div><div class="orbit-ring second"></div><span class="spark p1">✦</span><span class="spark p2">✧</span><span class="spark p3">✶</span><span class="spark p4">✦</span><div class="moon">💗</div><div class="moon small">${s.memories.length>1?'✨':'🌙'}</div><div class="planet"><div class="land"></div><div class="house">${wi[1]}</div></div></div>`};
function render(){save(); if(s.stage==='intro') return renderIntro();if(s.stage==='setup')return renderSetup();return renderHome()}
function renderIntro(){app.innerHTML=`<section class="full" style="text-align:center"><div class="row between"><span class="brand"><span class="brandmark">✦</span> 双生宇宙</span><span class="pill">概念体验 V0.1</span></div><div style="flex:1;display:flex;flex-direction:column;justify-content:center"><div class="eyebrow">WELCOME TO YOUR UNIVERSE</div>${planet(true)}<h1 class="stage-title">两个人的故事，<br>值得拥有一个宇宙。</h1><p class="hero-sub">不是相册，也不是问卷。<br>和我说几句话，看你们的世界如何诞生。</p></div><button class="primary" data-act="begin">开启我们的宇宙 <span>✦</span></button><p class="caption">可单人先体验 · 无需登录 · 不收取费用<br>演示阶段由本地规则模拟 AI，不会上传你输入的内容</p></section>`}
function renderSetup(){const tags=['✨ 惊喜灵感','🪐 双人宇宙','🌷 约会生活','📖 共同回忆','💌 情感沟通','🎨 故事创作'];app.innerHTML=`<section class="full"><div class="topline"><span class="brand"><span class="brandmark">✦</span> 双生宇宙</span><span class="pill">世界诞生中 · 1/1</span></div><div style="margin-top:20px"><span class="eyebrow">FIRST CONTACT</span><h1 class="stage-title" style="margin:12px 0">先认识一下你们。<br>不用写成长篇故事。</h1><p class="bodytext">只要几个小线索，我就能把第一颗星球送给你们。以后随时能修改。</p></div><div class="twocol"><div class="field"><label for="a">你想被怎么称呼？</label><input id="a" maxlength="16" value="${esc(s.a)}" placeholder="例如：小苏"></div><div class="field"><label for="b">TA 的称呼</label><input id="b" maxlength="16" value="${esc(s.b)}" placeholder="例如：小桃"></div></div><div class="field"><label for="memory">一件能代表你们的事 ✨</label><textarea rows="2" id="memory" maxlength="140" placeholder="例如：我们第一次见面是在学校食堂……">${esc(s.memory)}</textarea></div><div class="field"><label for="wish">最近想一起实现的小心愿（可选）</label><input id="wish" maxlength="100" value="${esc(s.wish)}" placeholder="例如：一起去海边看日落"></div><div class="field"><label>你们更接近哪种氛围？</label><div class="choicegrid">${Object.keys(vibeIcons).map(v=>`<button class="chip ${s.vibe===v?'active':''}" data-act="vibe" data-v="${v}">${vibeIcons[v]} ${v}</button>`).join('')}</div></div><div class="field"><label>首页想先看到什么？<span style="font-weight:400;color:#9b92ab"> 可多选</span></label><div class="taglist">${tags.map(t=>`<button class="chip ${s.interests.includes(t)?'active':''}" data-act="interest" data-v="${t}">${t}</button>`).join('')}</div></div><div class="space"></div><button class="primary" data-act="create">让我们的第一颗星球诞生 ✨</button><p class="caption">没有标准答案 · 当前版本不会进行真实人格分析</p></section>`}
function worldView(){const w=worldInfo();return `<div class="worldview"><div class="worldtop"><strong>🪐 ${esc(w[0])}</strong><div class="tiny">${esc(w[2])}</div></div>${planet()}<div class="worldbottom"><span class="chip">✦ ${s.memories.length} 段回忆</span><button class="chip" data-act="story">打开世界故事 ↗</button></div></div>`}
const featureDefs=[['🪐','回忆变星球','为世界添上故事','memory'],['🌠','心愿变计划','把想象带回现实','wishes'],['💌','AI 灵感','送你们一份小惊喜','inspire'],['📖','双人故事','你们的序章','story'],['💞','关系沟通','一个温柔的入口','talk'],['🧩','更多玩法','功能会慢慢长大','future']];
function renderHome(){const w=worldInfo();let inner='';if(s.tab==='world')inner=`<div class="screenhead"><div><div class="tiny">属于 ${esc(s.a)} 和 ${esc(s.b)} 的宇宙</div><div class="smalltitle">早安，宇宙旅人 ✨</div></div><button class="avatar" data-act="profile" aria-label="设置">⚙️</button></div><div style="margin:18px 0 14px" class="scene-tag">${vibeIcons[s.vibe]||'🌷'} ${esc(s.vibe)} 的双人星系 · 正在生长</div>${worldView()}<div class="sectiontitle"><h3>今天，宇宙想对你说</h3><span>AI 灵感</span></div>${aiCard()}<div class="sectiontitle"><h3>你们可以做些什么</h3><span>按偏好推荐</span></div><div class="featuregrid">${recommended().slice(0,4).map(featureHtml).join('')}</div><p class="caption">原型：世界由本地规则控制，尚未连接 DeepSeek</p>`;
else if(s.tab==='inspire')inner=`<div class="screenhead"><div><div class="tiny">小宇宙控制室</div><div class="smalltitle">AI 灵感工坊 ✨</div></div><button class="avatar" data-act="profile">⚙️</button></div><p class="bodytext">告诉我你们想做什么，我会试着把灵感变成一个可以开始的小行动。</p>${aiCard()}<div class="sectiontitle"><h3>三个快速入口</h3></div><div class="featuregrid">${[featureDefs[1],featureDefs[2],featureDefs[4],featureDefs[3]].map(featureHtml).join('')}</div><div class="note" style="margin-top:18px">💡 这版 AI 只做规则演示。正式接入模型后，会让它输出经过校验的功能指令，而不是直接编写页面。</div>`;
else if(s.tab==='wishes')inner=`<div class="screenhead"><div><div class="tiny">我们的未来星图</div><div class="smalltitle">心愿与行动 🌠</div></div><button class="avatar" data-act="profile">⚙️</button></div><p class="bodytext">未来像半透明星球。一个愿望被实现，宇宙里就多一点真实的光。</p><button class="primary" data-act="addWish">＋ 添加一个共同愿望</button><div class="sectiontitle"><h3>正在等待点亮</h3><span>${s.wishes.filter(w=>!w.done).length} 个未完成</span></div>${s.wishes.length?s.wishes.map((w,i)=>`<div class="wish"><span class="symbol">${w.done?'🌟':'🌙'}</span><div class="content"><strong>${esc(w.text)}</strong><small>${w.done?'已实现 · 星球被点亮':'还在未来等你们'}</small><div class="btnrow"><button class="mini-btn" data-act="plan" data-i="${i}">✨ 让 AI 帮忙计划</button><button class="mini-btn muted-btn" data-act="done" data-i="${i}">${w.done?'撤销完成':'标记实现'}</button></div></div></div>`).join(''):'<div class="empty">还没有心愿。<br>试着把一个未来想做的事交给宇宙吧。</div>'}<p class="caption">目前的计划生成属于离线演示，不会查询真实票价或地点</p>`;
else inner=`<div class="screenhead"><div><div class="tiny">不只是一个功能工具箱</div><div class="smalltitle">我们的秘密空间 💜</div></div><button class="avatar" data-act="profile">⚙️</button></div><div class="softcard" style="padding:18px;margin-top:20px"><div style="font-size:40px;margin-bottom:8px">👫 🪐</div><h3>${esc(s.a)} × ${esc(s.b)}</h3><p class="bodytext" style="margin:0">我们的小宇宙已经收藏 ${s.memories.length} 段回忆，${s.wishes.length} 个心愿。</p></div><div class="sectiontitle"><h3>功能星图</h3><span>持续扩展</span></div><div class="featuregrid">${featureDefs.map(featureHtml).join('')}</div><button class="secondary" style="width:100%;margin-top:17px" data-act="profile">查看资料 / 重新体验</button>`;
app.innerHTML=`<section class="page"><div class="topline"><span class="brand"><span class="brandmark">✦</span> 双生宇宙</span><span class="pill">✧ 小宇宙测试版</span></div>${inner}</section><nav class="navbar" aria-label="主导航">${[['world','🪐','宇宙'],['inspire','✨','灵感'],['wishes','🌠','心愿'],['more','💞','我们']].map(x=>`<button class="navbtn ${s.tab===x[0]?'active':''}" data-act="tab" data-v="${x[0]}" aria-label="${x[2]}"><span>${x[1]}</span>${x[2]}</button>`).join('')}</nav>`}
function recommended(){const keys=s.interests.join('');let a=[];if(keys.includes('回忆')||keys.includes('宇宙'))a.push(featureDefs[0]);if(keys.includes('约会'))a.push(featureDefs[1]);if(keys.includes('灵感'))a.push(featureDefs[2]);if(keys.includes('故事'))a.push(featureDefs[3]);if(keys.includes('沟通'))a.push(featureDefs[4]);return [...a,...featureDefs.filter(f=>!a.includes(f))]}
function featureHtml(f){return `<button class="feature" data-act="${f[3]}"><span class="emo">${f[0]}</span><strong>${f[1]}</strong><small>${f[2]}</small></button>`}
function aiCard(){let msg=`${esc(s.a)}，今天想不想和 ${esc(s.b)} 留下一件只有你们知道的小事？`;if(s.wishes.filter(w=>!w.done).length)msg=`你们的「${esc(s.wishes.find(w=>!w.done).text)}」还在发光。要不要试着让它离现实更近一步？`;else if(s.memories.length>1)msg=`你们已经收藏了 ${s.memories.length} 段故事。下一颗星球会是什么样呢？`;return `<div class="ai-card"><div class="row"><span class="ai-orb">✦</span><div><strong style="font-size:14px">宇宙小助手</strong><div class="tiny">这次，我不只想和你聊天</div></div></div><div class="ai-body">${msg}</div><button class="mini-btn" data-act="inspire">给我们一个灵感 ✨</button></div>`}
function sheet(title,body){modal.innerHTML=`<div class="overlay" data-act="closeBackdrop"><div class="sheet" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="sheet-top"><h2>${title}</h2><button class="close" data-act="close" aria-label="关闭">×</button></div>${body}</div></div>`}
function newMemory(){sheet('给宇宙增加一段回忆 🪐',`<p class="bodytext">一句话就够了，它会成为星球的一部分。</p><div class="field"><label for="newmem">你们曾经一起经历了什么？</label><textarea rows="3" id="newmem" maxlength="160" placeholder="例如：下雨天，我们躲进同一家奶茶店……"></textarea></div><button class="primary" data-act="saveMem">把回忆送上星空 ✨</button>`)}
function addWish(){sheet('许一个属于两个人的愿望 🌠',`<div class="field"><label for="newwish">你们想一起实现什么？</label><textarea rows="3" id="newwish" maxlength="120" placeholder="例如：下个月一起去海边看日落……"></textarea></div><button class="primary" data-act="saveWish">放进未来星图 ✨</button>`)}
function story(){const w=worldInfo();const recent=s.memories.slice(-2);sheet('你们的宇宙 · 序章 📖',`<div class="eyebrow">CHAPTER 01 · ${esc(w[0])}</div><p class="story">宇宙并不是从一声巨响开始的。<br>对 <strong>${esc(s.a)}</strong> 和 <strong>${esc(s.b)}</strong> 来说，它起源于一件微小的事情。<br><br>「${esc(s.memory||'两个普通人决定一起记录生活')}」<br><br>那天以后，宇宙出现了第一颗星球：<strong>${esc(w[0])}</strong>。它有一点点 ${esc(s.vibe)} 的颜色，还有许多尚未说出口的愿望。${recent.length>1?`<br><br>星空里后来又出现了新的光点：「${esc(recent[recent.length-1])}」。`:''}<br><br>故事尚未写完。接下来，由你们继续创造。</p><button class="primary" data-act="memory">继续写下一章 ✦</button><p class="caption">这是模板叙事演示，不是大模型实际生成的故事</p>`)}
function inspiration(){const choices=[`今天找一张你们都喜欢的照片，给它取一个特别古怪的名字。把它存进宇宙，成为一颗新星。`,`给 ${s.b} 留一句只有你们能读懂的话。等见面时，交换两人的小秘密。`,`选一个尚未实现的小愿望，只完成第一步。宇宙并不急着要你们实现全部。`,`轮流说出最近最期待的一件小事，用其中一个关键词给新星球命名。`];const v=choices[(s.memories.length+s.wishes.length+(s.seenLetter?1:0))%choices.length];s.seenLetter=true;save();sheet('今天的宇宙来信 💌',`<div class="softcard" style="padding:19px"><div class="eyebrow">A LETTER FROM YOUR UNIVERSE</div><h2 style="margin:15px 0">给 ${esc(s.a)} 和 ${esc(s.b)}</h2><p class="story">${esc(v)}</p><div class="taglist"><span class="chip">约 3 分钟</span><span class="chip">零预算</span><span class="chip">随时可以开始</span></div></div><p class="caption">当前使用本地创意模板，正式版可连接 AI 个性化生成</p><button class="primary" data-act="another">再拆一封信 ✉️</button>`)}
function plan(i){let w=s.wishes[i];if(!w){addWish();return}let t=w.text,steps=/海|岛|旅行|旅游|出游|去玩/.test(t)?['商量日期和可接受的总预算','确定交通方式和目的地，查看实际价格与天气','把需要准备的东西写成两人的共享清单']:/吃|餐|蛋糕|奶茶/.test(t)?['选一个双方都方便的时间','决定自己做还是外出体验，估算预算','确认食材或预约需求，再保存这段回忆']:['确定这个愿望最小、最简单的一步','和对方商量时间与预算，写下分工','完成后记录一次经历，让对应的星球亮起来'];sheet('把愿望变成行动 ✨',`<div class="softcard" style="padding:15px;margin:12px 0"><div class="tiny">当前心愿</div><h3 style="font-size:17px;margin-top:7px">${esc(t)}</h3></div><p class="bodytext">不必一下实现整个愿望。宇宙先给你们三个现实中的起点：</p>${steps.map((x,j)=>`<div class="todo"><div class="n">${j+1}</div><div>${esc(x)}</div></div>`).join('')}<div class="note">这些是示范步骤，未查询真实地点、天气、价格或可预约情况。</div><button class="primary" style="margin-top:18px" data-act="close">收下这份小计划</button>`)}
function talk(){sheet('让吵架前也有入口 💞',`<p class="bodytext">这个功能不会替谁判对错。正式版会尝试在情绪平稳时，帮助两个人表达感受、理解边界，并在双方愿意时复盘。</p><div class="softcard" style="padding:17px"><h3>试着从一句轻松的话开始</h3><p class="story">“最近有什么小事，是我做了却没发现你很在意的？”</p></div><p class="caption">争执调解暂不接入真实 AI，避免测试版给出不可靠的建议</p><button class="primary" data-act="close">先收藏这个想法</button>`)}
function future(){sheet('下一片星图还在绘制 🧩',`<p class="bodytext">后续可以接入：双方独立私密空间、双向绑定、共享心愿和日历、AI 对话、约会推荐、虚拟家园、情侣故事编辑等。</p><p class="bodytext">这一版先验证：<strong>用户是否愿意继续创造这颗星球，以及是否能轻松把愿望变成行动。</strong></p><button class="primary" data-act="close">回到小宇宙</button>`)}
function profile(){sheet('关于你们的小宇宙 ⚙️',`<div class="softcard" style="padding:16px"><strong>${esc(s.a)} × ${esc(s.b)}</strong><p class="sub" style="margin:7px 0 0">${esc(s.vibe)} · ${s.memories.length} 段回忆 · ${s.wishes.length} 个心愿</p></div><p class="bodytext" style="margin:18px 0">目前所有内容仅保存在此浏览器的本地存储中。不是云端同步，两个人还不能使用不同手机实时共享。</p><button class="secondary" style="width:100%" data-act="resetConfirm">清除数据，重新体验开局</button><button class="textbtn" style="width:100%;margin-top:8px" data-act="close">返回</button>`)}
function confirmReset(){sheet('确定清除本地宇宙？',`<p class="bodytext">这会删除当前浏览器里创建的称呼、回忆和愿望，无法撤回。</p><div class="btnrow"><button class="secondary" data-act="close">再想想</button><button class="primary" data-act="reset">确认清除</button></div>`)}
function toast(msg){sheet('一个小提醒 ✨',`<p class="bodytext">${esc(msg)}</p><button class="primary" data-act="close">知道啦</button>`)}
app.addEventListener('input',e=>{if(s.stage!=='setup')return;const id=e.target.id;if(['a','b','memory','wish'].includes(id)){s[id]=e.target.value;save()}});
function act(btn){const action=btn.dataset.act,v=btn.dataset.v,i=Number(btn.dataset.i);if(action==='begin'){s.stage='setup';render();app.scrollTop=0}
else if(action==='vibe'){s.vibe=v;render()}
else if(action==='interest'){s.interests=s.interests.includes(v)?s.interests.filter(k=>k!==v):[...s.interests,v];render()}
else if(action==='create'){const a=s.a.trim(),b=s.b.trim(),memory=s.memory.trim();if(!a||!b||!memory){toast('只需填写两个称呼和一段小回忆，就可以启动第一颗星球。');return} s.a=a;s.b=b;s.memory=memory;s.memories=[memory];s.wishes=s.wish.trim()?[{text:s.wish.trim(),done:false}]:[];s.stage='home';s.tab='world';render();app.scrollTop=0}
else if(action==='tab'){s.tab=v;render();app.scrollTop=0}
else if(action==='memory'){newMemory()}
else if(action==='saveMem'){let inp=document.getElementById('newmem'),v=inp?.value.trim();if(!v){toast('先写下一小段回忆吧。');return}s.memories.push(v);close();render()}
else if(action==='addWish'||action==='wishes'){addWish()}
else if(action==='saveWish'){let v=document.getElementById('newwish')?.value.trim();if(!v){toast('写一个愿望，宇宙才能替你收藏。');return}s.wishes.push({text:v,done:false});s.tab='wishes';close();render()}
else if(action==='done'){if(s.wishes[i])s.wishes[i].done=!s.wishes[i].done;render()}
else if(action==='plan'){plan(i)}
else if(action==='story'){story()}
else if(action==='inspire'||action==='another'){inspiration()}
else if(action==='talk'){talk()}
else if(action==='future'){future()}
else if(action==='profile'){profile()}
else if(action==='resetConfirm'){confirmReset()}
else if(action==='reset'){s=empty();close();render();app.scrollTop=0}
else if(action==='close'){close()}}
function close(){modal.innerHTML=''}
app.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(b)act(b)});
modal.addEventListener('click',e=>{if(e.target.classList.contains('overlay')){close();return}const b=e.target.closest('[data-act]');if(b)act(b)});
render();
})();
</script>
</body>
</html>
