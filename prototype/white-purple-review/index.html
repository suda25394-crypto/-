<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"><meta name="theme-color" content="#e7dbfa"><title>双生宇宙 · 交互预览</title>
<style>
:root {
  color-scheme: light;
  --white: #fff;
  --ink: #242328;
  --secondary: #64626b;
  --rule: #e4dbef;
  --line: #d4c6e7;
  --surface: #f4effa;
  --violet: #6939c7;
  --lilac: #e7dbfa;
  --chat-canvas: #eee7fa;
  --soft-violet: #f7f3fd;
  --deep-violet: #4b287c;
  --lilac-line: #d4bff1;
  --font: system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
  font-family: var(--font);
  color: var(--ink);
  background: #f1ecf7;
  -webkit-font-smoothing: antialiased;
}
*, *::before, *::after { box-sizing: border-box; }
body { margin: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
button { margin: 0; padding: 0; border: 0; background: transparent; text-align: inherit; cursor: pointer; touch-action: manipulation; }
button:disabled { cursor: default; }
button:focus-visible, label:focus-within, input:focus-visible, select:focus-visible, textarea:focus-visible {
  outline: 2px solid var(--violet); outline-offset: -2px;
}
[hidden] { display: none !important; }
h2, h3, p { margin: 0; }
h2 { font-weight: 650; font-size: 25px; line-height: 1.3; letter-spacing: -.04em; }
h3 { font-weight: 630; font-size: 16px; line-height: 1.5; }
#dp-couple-review {
  min-height: 100vh; min-height: 100dvh; display: grid; place-items: center;
  padding: clamp(12px, 3vh, 32px) 12px; -webkit-tap-highlight-color: transparent;
}
.dp-device {
  width: min(100%, 440px); height: min(866px, calc(100vh - clamp(24px, 6vh, 64px)));
  height: min(866px, calc(100dvh - clamp(24px, 6vh, 64px)));
  display: flex; flex-direction: column; position: relative; isolation: isolate;
  overflow: hidden; border: 1px solid var(--line); border-radius: 24px;
  background: var(--white); font-size: 15px; line-height: 1.5; text-align: left;
}
.dp-top {
  flex: none; display: grid; grid-template-columns: minmax(0,1fr) auto minmax(0,1fr); align-items: center;
  padding: max(5px, env(safe-area-inset-top,0px)) 12px 5px;
  min-height: 55px; border-bottom: 1px solid var(--lilac-line); background: var(--lilac); z-index: 5;
}
.dp-top-title { grid-row: 1; grid-column: 2; justify-self: center; font-size: 17px; font-weight: 660; color: var(--deep-violet); }
.dp-top-right { grid-column: 1/-1; justify-self: center; font-size: 11px; color: var(--secondary); }
.dp-top-right:empty { display: none; }
.dp-top>button, .rv-header-actions button {
  min-height: 42px; display: inline-flex; align-items: center; justify-content: center; border-radius: 8px;
}
.dp-top>button { grid-column: 1; grid-row: 1; width: 42px; justify-self: start; }
.dp-top>button svg { width: 20px; height: 20px; }
.rv-header-actions { grid-column: 3; grid-row: 1; justify-self: end; display: flex; align-items: center; gap: 1px; }
.rv-private-entry { gap: 4px; padding: 0 6px; font-size: 14px; font-weight: 600; color: var(--violet); white-space: nowrap; }
.rv-private-entry svg { width: 14px; height: 14px; }
.dp-change-bg { padding: 0 6px; font-size: 13px; font-weight: 500; color: var(--secondary); }
.dp-change-bg svg { display: none; }
.dp-device[data-route=home] .dp-change-bg { width: 38px; }
.dp-device[data-route=home] .dp-change-bg svg { display: block; width: 18px; height: 18px; }
.dp-device[data-route=home] .rv-bg-label { display: none; }
.dp-main {
  position: relative; min-height: 0; flex: 1 1 0; overflow-y: auto; overflow-x: hidden;
  overscroll-behavior: contain; scrollbar-width: thin; scrollbar-color: var(--line) transparent;
  padding: 16px 20px max(24px, env(safe-area-inset-bottom,0px));
}
.dp-main:focus-visible { outline: none; }
.dp-device:not([data-wall=photo]):is([data-route=home],[data-route=private]) .dp-main { background: var(--chat-canvas); }
.dp-device:is([data-route=home],[data-route=private]) .dp-main { padding: 0 16px 16px; }
.dp-caption,.dp-kicker,.dp-hint,.dp-muted { color: var(--secondary); font-size: 12px; line-height: 1.55; }
.dp-head { margin: 6px 0 18px; }
.dp-kicker { margin-bottom: 4px; font-weight: 500; }
.dp-section { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; margin: 23px 0 7px; }
.dp-section:first-child { margin-top: 4px; }
.dp-section small { color: var(--secondary); font-size: 11px; }
.dp-muted,.dp-hint { padding: 8px 0; }
.dp-list { border-block: 1px solid var(--rule); }
.dp-row { width: 100%; min-height: 52px; display: flex; align-items: center; gap: 12px; padding: 10px 3px; }
.dp-row+.dp-row,.dp-meta+.dp-meta { border-top: 1px solid var(--rule); }
.dp-row-body { display: grid; min-width: 0; flex: 1; gap: 2px; }
.dp-row-body strong { font-size: 14px; font-weight: 540; overflow-wrap: anywhere; }
.dp-arrow { margin-left: auto; color: var(--secondary); font: 20px/1 Arial,sans-serif; }
.dp-sheet { padding: 12px 0; overflow-wrap: anywhere; }
.dp-sheet p+p { margin-top: 8px; }
.dp-meta { display: flex; gap: 12px; align-items: center; justify-content: space-between; padding: 10px 0; font-size: 14px; }
.dp-meta span { color: var(--secondary); }
.dp-meta strong { font-weight: 560; text-align: right; }
.dp-grid { display: grid; grid-template-columns: repeat(4,minmax(0,1fr)); border-block: 1px solid var(--rule); padding: 6px 0; }
.dp-tile { display: grid; align-content: center; justify-items: center; gap: 6px; min-height: 67px; border-radius: 7px; color: var(--ink); font-size: 12px; }
.dp-symbol { display: inline-grid; place-items: center; width: 25px; height: 25px; font: 20px/1 Arial,sans-serif; color: var(--ink); }
.dp-tile .dp-symbol { color: var(--violet); }
.dp-symbol svg { width: 22px; height: 22px; stroke-width: 1.55; }
@media(hover:hover) {
  .dp-tile:hover,.dp-row:hover,.rv-dock button:hover,.rv-header-actions button:hover { background: var(--surface); }
}
.dp-feature {
  display: block; position: relative; width: 100%; text-align: left; border: 1px solid var(--rule); border-radius: 12px;
  overflow: hidden; background: var(--white);
}
.dp-feature canvas { display: block; width: 100%; height: 147px; object-fit: cover; object-position: center 43%; }
.dp-feature-body { background: var(--soft-violet); display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 12px 14px 13px; }
.dp-feature .dp-kicker,.dp-feature .dp-caption { display: block; }
.dp-feature .dp-kicker { margin: 0; font-size: 11px; }
.dp-feature h2 { margin: 1px 0 3px; font-size: 21px; }
.dp-feature-open { color:var(--violet); font-size: 21px; padding-right: 2px; }
.dp-hero,.dp-scene,.dp-memory-cover,.dp-book-cover { overflow: hidden; border-radius: 10px; background: var(--surface); }
.dp-hero { margin: 6px 0 10px; }
.dp-hero canvas,.dp-scene canvas { display: block; width: 100%; height: auto; }
.dp-hero canvas { max-height: 180px; object-fit: cover; }
.dp-scene { position: relative; }
.dp-pin { position: absolute; transform: translate(-50%,-50%); width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--lilac-line); background: var(--white); color: var(--violet); text-align: center; font-size: 18px; }
.dp-pin::after { content: ""; position: absolute; inset: -4px; }
.dp-pin:not(.second):not(.third) { left: 77%; top: 37%; }
.dp-pin.second { left: 16%; top: 66%; }
.dp-pin.third { left: 44%; top: 54%; }
.dp-float-note { margin-top: 16px; }
.dp-float-note .dp-section { margin: 0 0 5px; }
.dp-float-note p { color: var(--secondary); font-size: 14px; }
.dp-memory-cover { position: relative; isolation: isolate; min-height: 108px; display: flex; align-items: flex-end; padding: 12px; background: #f6f4fa; }
.dp-memory-cover::before,.dp-memory-cover::after { content: ""; position: absolute; z-index: -1; inset: 10% -8% -2%; background: #e6e0f0; clip-path: polygon(0 75%, 24% 46%, 52% 68%, 80% 20%, 100% 47%, 100% 100%, 0 100%); }
.dp-memory-cover::after { background: #d7cbe9; transform: translate(12%,24%); }
.dp-memory-cover b { color: var(--ink); background: var(--white); padding: 2px 7px; border-radius: 4px; font-size: 12px; font-weight: 550; }
.dp-book-cover { display: flex; align-items: flex-end; gap: 7px; min-height: 108px; padding: 16px; background: #f2eff7; }
.dp-book-cover i { width: 23%; height: 36px; border: 1px solid #b1a8c0; border-left: 6px solid #716980; border-radius: 1px; transform: skewY(-6deg); background: var(--white); }
.dp-book-cover i:nth-child(2){height: 53px; border-left-color: var(--violet); transform: rotate(-6deg) skewY(-3deg);}
.dp-book-cover i:nth-child(3){height: 42px; border-left-color: #aaa6b0;}
.dp-tabs { display: flex; gap: 3px; margin: 8px 0 15px; padding: 3px; border-radius: 9px; background: var(--surface); }
.dp-tabs button { flex: 1; text-align: center; min-height: 37px; padding: 4px; border-radius: 6px; font-size: 14px; color: var(--secondary); }
.dp-tabs [aria-pressed=true] { color: var(--violet); background: var(--white); font-weight: 600; }
.dp-primary,.dp-secondary,.dp-compose button,.dp-bg-actions button,.dp-bg-file-label { min-height: 44px; border-radius: 9px; padding: 9px 13px; text-align: center; font-size: 14px; font-weight: 600; }
.dp-primary,.dp-secondary { display: block; width: 100%; }
.dp-primary,.dp-compose button,.dp-bg-actions [data-bg-action=apply] { background: var(--violet); color: var(--white); }
.dp-secondary,.dp-bg-file-label { background: var(--surface); color: var(--ink); }
.dp-action { margin-top: 16px; }
.dp-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 15px 0; }
.dp-soft { display: inline-flex; align-items: center; gap: 6px; margin-top: 5px; min-height: 42px; color: var(--violet); font-size: 14px; font-weight: 550; }
.dp-assist { width: 100%; display: flex; align-items: center; gap: 9px; min-height: 46px; margin-top: 18px; border-top: 1px solid var(--rule); color: var(--violet); font-size: 14px; }
.dp-assist b { display: inline-grid; place-items: center; height: 25px; min-width: 29px; border-radius: 6px; background: var(--lilac); font-size: 11px; }
.dp-assist span:last-child { margin-left: auto; }
.dp-field { display: grid; gap: 5px; margin: 12px 0; color: var(--secondary); font-size: 13px; }
.dp-field :is(input,textarea,select),.dp-compose input,.rv-input { width: 100%; min-width:0; border: 1px solid var(--line); background: var(--white); border-radius: 9px; color: var(--ink); padding: 9px 11px; font-size: 16px; line-height: 1.5; }
.dp-field textarea { min-height: 80px; resize: vertical; }
.dp-compose { display: flex; align-items: center; gap: 8px; margin: 12px 0 5px; }
.dp-compose button { flex: none; }
.dp-warning,.dp-bg-note,.dp-bg-status { color: var(--ink); font-size: 12px; }
.dp-warning:not(:empty) { border-left: 2px solid var(--violet); margin-top: 8px; padding-left: 8px; }
.rv-personal-heading,.paper-head { display: flex; align-items: center; gap: 13px; margin: 10px 0 21px; }
.rv-personal-heading h2 { font-size: 22px; }
.rv-personal-heading p { margin-top: 3px; color: var(--secondary); font-size: 13px; }
.paper-head .dp-head { margin: 0; }
.paper-id,.rv-avatar,.dp-avatar { display: inline-grid; flex: none; place-items: center; width: 31px; height: 31px; border-radius: 50%; color: var(--ink); background: var(--surface); font-size: 18px; }
.paper-head .paper-id,.rv-personal-heading .paper-id { width: 46px; height: 46px; font-size: 26px; }
.rv-avatar.mine,.paper-id:not(.partner) { color: var(--violet); background: var(--lilac); }
.rv-avatar.dp,.dp-avatar { color: var(--white); background: var(--violet); font-size: 11px; font-weight: 600; }
.rv-avatar svg { width: 20px; height: 20px; }
.rv-thread { display: flex; flex-direction: column; gap: 15px; padding: 13px 0 6px; }
.rv-privacy,.rv-date { align-self: center; color: var(--secondary); font-size: 11px; line-height: 1.5; text-align: center; }
.rv-privacy { display: flex; align-items: center; gap: 5px; }
.rv-privacy svg { width: 12px; height: 12px; }
.rv-privacy i { font-style: normal; }
.rv-demo-link { padding: 4px 0; color: var(--secondary); text-decoration: underline; text-underline-offset: 2px; }
.rv-chat,.dp-message { display: flex; align-items: flex-start; gap: 8px; }
.rv-chat.is-mine { flex-direction: row-reverse; }
.dp-message { margin: 12px 0; }
.dp-message.mine { justify-content: flex-end; }
.rv-msg { max-width: min(82%,306px); min-width: 0; }
.rv-author { display: block; margin: -1px 1px 3px; color: var(--secondary); font-size: 11px; }
.rv-chat.is-mine .rv-author { text-align: right; }
.rv-bubble,.dp-bubble { display: inline-block; padding: 9px 12px; border-radius: 4px 13px 13px; color: var(--ink); background: var(--surface); white-space: pre-wrap; overflow-wrap: anywhere; font-size: 15px; line-height: 1.6; }
.dp-bubble { max-width: 85%; }
.rv-chat .rv-bubble { background: var(--white); }
.rv-chat.is-mine .rv-bubble,.dp-message.mine .dp-bubble { background: var(--violet); color: var(--white); border-radius: 13px 4px 13px 13px; }
.rv-chat.is-dp .rv-bubble { background: var(--soft-violet); border: 1px solid var(--lilac-line); }
.rv-plan { display: flex; width: min(100%,310px); overflow: hidden; background: var(--white); border: 1px solid var(--rule); border-radius: 10px; color: var(--ink); }
.rv-thread>.rv-plan { margin-left: 39px; width: min(calc(100% - 39px),310px); }
.rv-plan-art { position: relative; flex: 0 0 29%; min-height: 79px; overflow: hidden; background: var(--lilac); }
.rv-plan-art canvas { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.rv-plan-body { display: flex; flex-direction: column; justify-content: center; gap: 1px; padding: 8px 12px; }
.rv-plan-body small { color: var(--violet); }
.rv-plan-body strong { font-size: 17px; font-weight: 630; }
.rv-plan-body span,.rv-plan-body small { font-size: 12px; overflow-wrap: anywhere; }
.rv-plan-body span { color: var(--secondary); }
.rv-editor { flex: none; display: flex; align-items: flex-end; gap: 7px; padding: 7px 11px max(8px,env(safe-area-inset-bottom)); background: var(--white); border-top: 1px solid var(--rule); }
.rv-editor button { flex: none; width: 42px; height: 42px; display: grid; place-items: center; border-radius: 50%; }
.rv-editor button svg { width: 20px; height: 20px; }
.rv-editor .rv-send { background: var(--violet); color: var(--white); }
.rv-editor .rv-send:disabled { color: var(--secondary); background: var(--surface); }
.rv-input { flex: 1; display: block; height: 42px; max-height: 92px; resize: none; border: 0; border-radius: 11px; background: var(--surface); }
.rv-input::placeholder { color: var(--secondary); }
.rv-menu { flex: none; display: flex; flex-wrap: wrap; gap: 6px; padding: 8px 12px; border-top: 1px solid var(--rule); background: var(--white); }
.rv-menu button { display: inline-flex; align-items: center; gap: 5px; min-height: 40px; padding: 4px 10px; color: var(--violet); font-size: 13px; }
.rv-menu svg { width: 16px; height: 16px; }
.rv-dock { flex: none; display: grid; grid-template-columns: repeat(4,minmax(0,1fr)); padding: 3px 6px max(3px,env(safe-area-inset-bottom)); background: var(--white); border-top: 1px solid var(--rule); }
.rv-dock button { min-height: 49px; min-width: 0; display: grid; justify-items: center; align-content: center; gap: 2px; border-radius: 7px; text-align: center; font-size: 12px; line-height: 16px; color: var(--secondary); }
.rv-dock svg { width: 21px; height: 21px; }
.rv-dock [aria-current=page] { position: relative; isolation: isolate; color: var(--deep-violet); font-weight: 650; }
.rv-dock [aria-current=page]::before { content: ""; position: absolute; z-index: -1; top: calc(50% - 22px); left: 50%; transform: translateX(-50%); width: 44px; height: 27px; border-radius: 14px; background: var(--lilac); }
.rv-dock [aria-current=page] svg { fill: var(--lilac); stroke-width: 1.95; }
.dp-personal-bg { display: none; position: absolute; inset: 0; z-index: -1; pointer-events: none; }
[data-wall=photo] .dp-personal-bg { display: block; }
.dp-personal-bg img { display: block; width: 100%; height: 100%; object-fit: cover; }
[data-wall=photo] :is(.rv-privacy,.rv-date,.rv-author,.dp-head,.dp-section,.dp-list,.dp-grid,.dp-sheet,.dp-assist,.dp-muted,.dp-float-note,.dp-warning,.dp-field,.paper-head,.rv-personal-heading,.dp-soft,.dp-hint) { background: var(--white); border-radius: 6px; }
[data-wall=photo] :is(.rv-privacy,.rv-date,.rv-author,.dp-soft,.dp-warning) { padding: 1px 6px; }
[data-wall=photo] .rv-author { display: table; margin-bottom: 3px; }
[data-wall=photo] .is-mine .rv-author { margin-left: auto; }
[data-wall=photo] :is(.dp-head,.dp-section,.dp-list,.dp-grid,.dp-sheet,.dp-assist,.dp-float-note,.dp-field,.paper-head,.rv-personal-heading) { padding: 5px 8px; }
.dp-bg-editor,.rv-demo-panel { z-index: 8; background: var(--white); border: 1px solid var(--line); border-radius: 12px; }
.dp-bg-editor { flex: none; max-height: 43%; overflow-y: auto; margin: 6px 12px; padding: 13px; }
.dp-edit-head,.dp-bg-tools,.dp-bg-actions { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.dp-edit-head small,.dp-bg-tools button { color: var(--secondary); font-size: 12px; }
.dp-bg-tools,.dp-bg-actions { margin-top: 9px; }
.dp-bg-file-label { position: relative; display: inline-flex; align-items: center; overflow: hidden; }
.dp-bg-tools button { min-height: 44px; padding-inline: 6px; }
.dp-bg-actions { justify-content: flex-end; border-top: 1px solid var(--rule); padding-top: 8px; }
.dp-bg-file-label input { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; }
.dp-bg-note { margin-top: 6px; color: var(--secondary); }
.dp-bg-status:not(:empty) { padding: 5px 12px; background: var(--white); }
.rv-demo-panel { position: absolute; left: 14px; right: 14px; top: 64px; padding: 16px; }
.rv-demo-panel p { margin: 6px 0 12px; font-size: 14px; }

  #dp-couple-review { display: block; min-height: 0; padding: 0; background: var(--white); }

}

}

  .dp-device[data-typing=yes] .rv-dock { display: none; }
}
</style></head><body>
<div id="dp-couple-review">
  <div class="dp-device" lang="zh-CN" aria-label="双生宇宙 · 手机交互选稿">
    <div class="dp-personal-bg" aria-hidden="true"><img alt=""></div>
    <header class="dp-top">
      <button type="button" data-act="back" aria-label="返回上一页" hidden>‹</button>
      <strong class="dp-top-title">我们仨</strong>
      <div class="rv-header-actions">
        <button type="button" class="dp-change-bg cursor-interaction" data-act="background" aria-label="换背景" title="换背景" aria-expanded="false"><span class="rv-bg-label">换背景</span></button>
        <button type="button" class="rv-private-entry" data-act="go:private" aria-label="和 DP 私聊">私聊</button>
      </div>
      <span class="dp-top-right"></span>
    </header>
    <section class="dp-bg-editor" aria-label="换背景" hidden>
      <div class="dp-edit-head"><strong>我的背景</strong><small>仅自己可见</small></div>
      <div class="dp-bg-tools"><label class="dp-bg-file-label cursor-interaction" role="button">从相册选择<input type="file" data-bg-file accept="image/*" aria-label="从相册选择背景图片"></label><button type="button" class="cursor-interaction" data-bg-action="reset">恢复默认</button></div>
      <p class="dp-bg-note" aria-live="polite"></p>
      <div class="dp-bg-actions"><button type="button" class="cursor-interaction" data-bg-action="cancel">取消</button><button type="button" class="cursor-interaction" data-bg-action="apply">应用背景</button></div>
    </section>
    <div class="dp-bg-status" role="status"></div>
    <main class="dp-main" aria-label="当前页面"></main>
    <div class="rv-menu" hidden></div>
    <form class="rv-editor" data-submit="sendHome" hidden aria-label="聊天输入栏">
      <button type="button" class="rv-more" data-act="chatTools" aria-expanded="false" aria-label="更多聊天操作"></button>
      <textarea class="rv-input" rows="1" name="homeMessage" maxlength="500" placeholder="发到我们仨，@DP 可提问…" aria-label="发到我们仨"></textarea>
      <button type="submit" class="rv-send" aria-label="发送消息">发送</button>
    </form>
    <nav class="rv-dock" aria-label="底部主导航"></nav>
  </div>
  
</div>
<script>
(() => {
 const root=document.getElementById('dp-couple-review');
 const main=root.querySelector('.dp-main'), top=root.querySelector('.dp-top-title'), topRight=root.querySelector('.dp-top-right');
 const device=root.querySelector('.dp-device'),photoLayer=root.querySelector('.dp-personal-bg img'),bgPanel=root.querySelector('.dp-bg-editor'),bgButton=root.querySelector('.dp-change-bg'),fileInput=root.querySelector('[data-bg-file]'),bgNote=root.querySelector('.dp-bg-note'),bgStatus=root.querySelector('.dp-bg-status');
 const storageKey='dp-couple-review-backdrop-v1';
 let savedPhoto='',draftPhoto='',pickVersion=0,loadingPhoto=false;
 try{const v=localStorage.getItem(storageKey);if(v&&v.startsWith('data:image/jpeg;base64,'))savedPhoto=v;}catch{}
 function renderPhoto(data){
  device.dataset.wall=data?'photo':'default';

 function respond(id,text){
  if(id==='plan')return /时间|点|改|晚|早/.test(text)?'可以打开下方的约会编辑，写下你希望碰头的时间；改动后两个人可重新确认。':'先把新的碰头地点写进计划，方便对方看到后确认。';
  if(id==='talk')return '你想让对方先听懂哪一部分？可以先留在自己的草稿里。';
  if(id==='wish')return '可以先留在心愿里。两个人时间合适时，再关联到约会。';
  if(id==='game')return '这一题会在你们都提交后揭晓。更想一起去做的事，也能记成心愿。';
  if(id==='memory')return '你愿意把哪一个片段留在两个人都能看到的记忆里？';
  if(id==='universe')return '水岸步道上有那次散步的回忆。可以点地图上的水纹查看。';
  return basicReply[id]||'可以先记下这个想法，再回到对应页面修改。';
 }
 function act(action){
  if(action==='background'){state.menuOpen=false;renderMenu();editWallpaper();return;}
  if(!bgPanel.hidden){if(action==='back'){dismissWallpaper(false);return;}dismissWallpaper(false);}
  bgStatus.textContent='';
  const sep=action.indexOf(':'),kind=sep<0?action:action.slice(0,sep),arg=sep<0?'':action.slice(sep+1);
  state.msg='';
  if(kind==='tab'){if(arg!==state.route)navigate(arg);return;}
  if(kind==='go')return navigate(arg);
  if(kind==='back')return back();
  if(kind==='chatTools'){state.menuOpen=!state.menuOpen;renderMenu();return;}
  if(kind==='demoNote'){demoNote();return;}
  if(kind==='closeDemo'){closeNote();root.querySelector('[data-act="demoNote"]')?.focus();return;}
  if(kind==='sendHome'){sendHome();return;}
  if(kind==='mentionDP'){state.menuOpen=false;renderMenu();if(!chatInput.value.toLowerCase().includes('@dp'))chatInput.value=('@DP '+chatInput.value).slice(0,500);drafts[chatChannel()]=chatInput.value;send.disabled=!chatInput.value.trim();remember();chatInput.focus();return;}
  if(kind==='dp'){state.module=arg;return navigate('assistant');}
  if(kind==='mem'){state.selectedMem=Number(arg);return navigate('memorydetail');}
  if(kind==='edit'){state.editing=Number(arg);return navigate('editprofile');}
  if(kind==='p'){state.profileTab=arg;state.preview=false;}
  if(kind==='togglePreview')state.preview=!state.preview;
  if(kind==='world')state.world=arg;
  if(kind==='game')state.game=arg;
  if(kind==='guess')state.guess=arg;
  if(kind==='changeGame'){state.game='';state.guess='';}
  if(kind==='toggle')state.saved[arg]=!state.saved[arg];
  if(kind==='linkWish'){state.wish=true;remember();return navigate('plan');}
  if(kind==='confirmPlan')state.plan.me=true;
  if(kind==='savePlan'){
   const time=valueOf('time'),place=valueOf('place');
   if(!time||!place)state.msg='写下碰头时间和地点后即可保存。';
   else {if(time!==state.plan.time||place!==state.plan.place){state.plan={time,place,me:false,partner:false};}remember();return back();}
  }
  if(kind==='saveMemory'){
   const memo=valueOf('memo');if(!memo)state.msg='写下一句想保留的细节吧。';
   else {if(!state.finished)state.memories.push({name:'周六看展',note:memo,date:'11 月 21 日'});state.finished=true;state.selectedMem=state.memories.length-1;state.route='memorydetail';syncLocation(true);main.scrollTop=0;}
  }
  if(kind==='openmemory'){state.selectedMem=state.memories.length-1;return navigate('memorydetail');}
  if(kind==='saveCaption'){const c=valueOf('caption');if(!c)state.msg='请写一句图注。';else{state.albumCaption=c;remember();return back();}}
  if(kind==='savePref'){
   const p=valueOf('pref'),s=valueOf('scope');if(!p)state.msg='请写下想保留的内容。';
   else {state.profiles[state.editing]={title:p,scope:s};remember();return back();}
  }
  if(kind==='delPref'){state.profiles.splice(state.editing,1);remember();return back();}
  if(kind==='sendGuide'){
   const t=valueOf('message');if(!t)state.msg='可以先写一句自己的感受。';else state.guideText=t;
  }
  if(kind==='storeGuide'){
   const t=valueOf('draft');if(!t)state.msg='请写下你想保存的一句话。';
   else {state.profiles.push({title:t,scope:'仅自己可见'});state.guideText='';state.profileTab='me';state.preview=false;remember();if(state.history[state.history.length-1]==='profile')return back();return navigate('profile');}
  }
  if(kind==='saveTalk'){const t=valueOf('talk');if(!t)state.msg='写一点内容后即可保存。';else {state.talk=t;state.msg='私人草稿已保存。';}}
  if(kind==='sendDP'){
   const t=valueOf('message');if(!t)state.msg='先输入一句话。';
   else{const id=state.module;const log=state.logs[id]||(state.logs[id]=[]);log.push(['我',t],['DP',respond(id,t)]);}
  }
  remember();draw();
 }
 function draw(){
  const [title,side,body]=page(state.route),home=state.route==='home';device.dataset.route=state.route;main.innerHTML=body;
  topRight.textContent=side;
  const tabPage=primaryRoutes.some(([id])=>id===state.route);
  dock.hidden=!tabPage;
  for(const control of dock.querySelectorAll('[data-tab]')){
   if(control.dataset.tab===state.route)control.setAttribute('aria-current','page');else control.removeAttribute('aria-current');
  }
  const previous=state.history[state.history.length-1];
  backButton.hidden=home||(tabPage&&(!previous||primaryRoutes.some(([id])=>id===previous)));
  backButton.innerHTML=glyph('chevron');backButton.setAttribute('aria-label',state.route==='private'?'返回我们仨':'返回上一页');
  top.textContent=title;privateEntry.hidden=!home;
  editor.hidden=!isChat();renderMenu();
  if(isChat()){
   const privateChat=state.route==='private';
   chatInput.value=drafts[chatChannel()]||'';
   chatInput.placeholder=privateChat?'私下和 DP 说…':'发到我们仨…';
   chatInput.setAttribute('aria-label',privateChat?'私下发给 DP':'发到我们仨');
   editor.setAttribute('aria-label',privateChat?'私聊输入栏':'群聊输入栏');
   send.setAttribute('aria-label',privateChat?'发给 DP':'发送到我们仨');
   send.disabled=!chatInput.value.trim();
  }
  main.querySelectorAll('[data-art]').forEach(paint);
 }
 function paint(canvas){
  const kind=canvas.dataset.art;
  const world=kind==='world';
  const width=kind==='thumb'?400:760, height=kind==='thumb'?400:world?440:444;
  canvas.width=width;canvas.height=height;
  const ctx=canvas.getContext('2d');if(!ctx)return;
  const paper='#ffffff',field='#f7f5fc',pale='#ede8f9',middle='#c6b6e7',fold='#a38ace',violet='#6939c7',ink='#51465d';
  function shape(path,color){ctx.fillStyle=color;ctx.fill(new Path2D(path));}
  function stroke(path,color,weight=2){ctx.lineWidth=weight;ctx.strokeStyle=color;ctx.lineCap='round';ctx.lineJoin='round';ctx.stroke(new Path2D(path));}
  function rect(x,y,w,h,color){ctx.fillStyle=color;ctx.fillRect(x,y,w,h);}
  function ginkgo(x,y,scale,angle,color){
   ctx.save();ctx.translate(x,y);ctx.rotate(angle);ctx.scale(scale,scale);
   shape('M0 0 C-20 -20 -45 -22 -62 -52 Q-63 -59 -54 -57 Q-48 -69 -39 -63 Q-33 -75 -24 -67 Q-18 -78 -11 -70 L-2 -57 L2 -72 Q9 -81 17 -73 Q26 -77 32 -68 Q41 -73 47 -61 Q55 -65 59 -54 C52 -28 20 -19 0 0Z',color);
   stroke('M0 0 Q-1 -24 -15 -49 M0 0 Q-15 -26 -40 -45 M0 0 Q12 -28 34 -49',paper,1.2);
   ctx.restore();
  }
  rect(0,0,width,height,paper);
  if(!world){
   if(kind==='thumb'){
    rect(0,0,width,height,field);
    shape('M230 341V162a93 93 0 0 1 186 0v179h-24V162a69 69 0 0 0-138 0v179z',pale);
    stroke('M48 382 Q108 225 222 118 M116 244 Q127 199 126 157',ink,3);
    ginkgo(132,220,1.13,-.59,middle);ginkgo(206,139,1.5,.54,violet);
   }else{
    shape('M420 337V148a112 112 0 0 1 224 0v189h-24V148a88 88 0 0 0-176 0v189z',pale);
    stroke('M0 328H173 M316 328H718',middle,1.3);
    stroke('M80 384Q146 258 301 121 M154 261Q146 210 139 176',ink,2.5);
    ginkgo(145,207,.89,-.69,middle);ginkgo(230,167,1.33,.16,violet);ginkgo(300,123,.73,.75,fold);
   }
   return;
  }
  // The bank, jetty and buildings sit under their interactive location pins.
  shape('M0 178Q121 158 236 173T485 157T760 151v289H0z',field);
  shape('M0 321Q139 273 257 302Q411 350 508 286T760 272v168H0z',pale);
  stroke('M6 351Q132 311 234 333 M385 364Q465 346 509 315 M633 307Q697 284 743 287',middle,1.8);
  shape('M44 321l136 -49 8 13 -137 49z',middle);
  stroke('M50 329l134 -48',ink,1.5);
  rect(260,216,146,67,paper);rect(264,211,4,69,ink);rect(398,211,4,69,ink);
  shape('M250 218l15 -28h134l16 28z',violet);
  for(let i=0;i<4;i++){const x=278+29*i;stroke('M'+x+' 192l-5 23',paper,2);}
  rect(255,251,156,5,ink);rect(264,262,135,18,middle);
  [16,21,11,19,23,13,17,10,19,22].forEach((h,i)=>rect(274+i*11,249-h,7,h,[fold,pale,ink,middle][i%4]));
  rect(505,127,128,97,paper);shape('M491 129Q568 21 647 129Z',middle);
  shape('M535 220v-53a36 36 0 0 1 72 0v53z',fold);
  stroke('M570 135v85 M538 178h66',paper,2.5);
  rect(498,222,143,4,ink);rect(488,230,161,3,middle);
  [[94,218,1],[173,192,.69],[692,206,.85]].forEach(([x,y,s],i)=>{
   stroke('M'+x+' '+y+'v-'+(36*s),ink,2.5);ginkgo(x,y-30*s,s,0,i===1?middle:fold);
  });
 }
 fileInput.addEventListener('change',()=>previewUpload(fileInput.files[0]));
 const viewport=window.visualViewport;
 let restingHeight=viewport?.height||window.innerHeight,keyboardSeen=false;
 function beginTyping(){device.dataset.typing='yes';}
 function endTyping(){delete device.dataset.typing;keyboardSeen=false;}
 chatInput.addEventListener('focus',beginTyping);
 chatInput.addEventListener('pointerdown',beginTyping);
 editor.addEventListener('focusout',e=>{if(!editor.contains(e.relatedTarget))endTyping();});
 viewport?.addEventListener('resize',()=>{
  if(!device.dataset.typing){restingHeight=viewport.height;return;}
  if(restingHeight-viewport.height>100)keyboardSeen=true;
  else if(keyboardSeen&&restingHeight-viewport.height<50){endTyping();restingHeight=viewport.height;}
 });
 chatInput.addEventListener('input',()=>{if(!isChat())return;drafts[chatChannel()]=chatInput.value;send.disabled=!chatInput.value.trim();remember();});
 chatInput.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing&&e.keyCode!==229){e.preventDefault();sendHome();}});
 bgPanel.addEventListener('click',e=>{const a=e.target.closest('[data-bg-action]')?.dataset.bgAction;if(a==='apply'||a==='cancel')dismissWallpaper(a==='apply');if(a==='reset'){pickVersion++;fileInput.value='';draftPhoto='';renderPhoto('');note('默认纸雕背景预览，点「应用背景」保存。');}});
 document.addEventListener('keydown',e=>{if(e.key!=='Escape')return;if(!bgPanel.hidden){dismissWallpaper(false);return;}if(root.querySelector('.rv-demo-panel')){closeNote();return;}if(state.menuOpen){state.menuOpen=false;renderMenu();return;}if(state.route!=='home')back();});
 root.addEventListener('click',e=>{const button=e.target.closest('[data-act]');if(button&&root.contains(button))act(button.dataset.act);});
 root.addEventListener('submit',e=>{const form=e.target.closest('[data-submit]');if(form){e.preventDefault();act(form.dataset.submit);}});
 draw();
})();
</script>
</body></html>
