const store=()=>{state.variant=current;try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}};
const svg={arrow:'<path d="M5 12h14m-6-6 6 6-6 6"/>',heart:'<path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 0 0-7.8 7.8L12 21l8.8-8.6a5.5 5.5 0 0 0 0-7.8z"/>',close:'<path d="M18 6 6 18M6 6l12 12"/>',chevron:'<path d="m9 18 6-6-6-6"/>',spark:'<path d="m12 2 1.6 6.4L20 10l-6.4 1.6L12 18l-1.6-6.4L4 10l6.4-1.6L12 2Z"/><path d="m20 17 .7 2.3L23 20l-2.3.7L20 23l-.7-2.3L17 20l2.3-.7L20 17Z"/>',message:'<path d="M21 11.5a8.4 8.4 0 0 1-9 8.4 9.7 9.7 0 0 1-4-.9L3 21l1.5-4.5a8.8 8.8 0 0 1-1.5-5A8.5 8.5 0 0 1 12 3a8.4 8.4 0 0 1 9 8.5Z"/>',bookmark:'<path d="M5 4h14v17l-7-5-7 5V4Z"/>',shuffle:'<path d="m18 14 4 4-4 4M2 18h3c5 0 6-12 11-12h6m-4-4 4 4-4 4M2 6h3c2.5 0 4 2 5 4m4 4c1 2 3 4 5 4h3"/>'};
const icon=(name,cls='')=>`<svg class="ic ${cls}" viewBox="0 0 24 24" aria-hidden="true">${svg[name]||svg.arrow}</svg>`;
const esc=(s)=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function shuffle(a){const x=[...a];for(let i=x.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[x[i],x[j]]=[x[j],x[i]]}return x}
function draw(){let d=state.deck.filter(x=>x!==current);if(!d.length)d=shuffle([0,1,2,3,4].filter(x=>x!==current));const next=d.shift();state.deck=d;current=next;store();render()}
function choose(n){current=n;state.deck=state.deck.filter(x=>x!==n);store();modal='';render()}
function toggleFav(){state.favs=state.favs.includes(current)?state.favs.filter(x=>x!==current):[...state.favs,current];store();renderStudio();if(modal==='favs')renderOverlay()}
function studio(){return `<div><div class="st-title">设计抽卡 / ${String(current+1).padStart(2,'0')}</div><div class="st-sub">${labels[current]}</div></div><div class="space"></div><button class="iconbtn ${state.favs.includes(current)?'active':''}" data-act="fav" aria-label="收藏当前设计">${icon('heart')}</button><button data-act="favs">收藏 ${state.favs.length}</button><button class="primary" data-act="draw">${icon('shuffle','small')} 换一张</button>`}
function renderStudio(){document.getElementById('studio').innerHTML=studio()}
function daily(){return state.avoidCrowds?'安静的小店 + 傍晚散步':'找个舒服的地方，一起去看看';}
function moodHint(){return state.avoidCrowds?'已经记住：避开人多的地方':'正在慢慢了解你们';}
function renderTalk(){return `<div class="layout mode-talk"><div class="head"><div class="avatars"><i></i><i></i></div><div><h2>我们之间</h2><small>只和 AI 聊，其他交给它</small></div><div class="online">● 在这里</div></div><div class="thread"><div class="daytag">TODAY · FOR YOU TWO</div><div class="thread-label">${icon('spark','small')} 你的专属 AI</div><div class="bubble"><strong>早安。</strong><br>今天的生活，有没有什么想交给我？</div><div class="bubble you">周末想一起出去，又不想太累。</div><div class="bubble">${esc(daily())}。<br>我已经帮你们整理好了。</div><button class="nudge" data-detail="date"><span><h3>周末的小小计划</h3><small>${esc(state.avoidCrowds?'避开人群 · 轻松约会':'轻松散步 · 一起吃点好的')}</small></span><span class="circle">${icon('arrow')}</span></button></div><div class="composing"><button data-act="chat"><span>和我说说你的想法…</span><b>${icon('arrow')}</b></button></div></div>`}
function renderCanvas(){return `<div class="layout mode-canvas"><div class="microhead"><span>WE, TOGETHER</span><span class="tag">属于你们的日常</span></div><div class="giant"><span>AI CURATES YOUR DAY</span><h1>今天，<br>交给我。</h1></div><div class="art"><div class="glow"></div><div class="halo"></div></div><div class="floating"><button data-detail="date"><strong>下一次约会</strong><small>${state.avoidCrowds?'选安静一点的地方':'等你们一起去'}</small></button><button data-detail="surprise"><strong>一份小惊喜</strong><small>有些心意不用说</small></button></div><div class="art-bottom"><button data-act="chat"><span>告诉 AI，你在想什么</span>${icon('arrow')}</button></div><div class="foot">CARE IS IN THE DETAILS</div></div>`}
function renderOrbit(){const lines=`<svg class="lines" viewBox="0 0 390 560" preserveAspectRatio="none"><g stroke="#b9cdc6" fill="none" stroke-width="1.3" stroke-dasharray="3 5" opacity=".8"><path d="M195 286 Q102 140 72 111"/><path d="M195 286 Q300 166 317 133"/><path d="M195 286 Q85 365 76 439"/><path d="M195 286 Q300 365 316 445"/></g><circle cx="195" cy="286" r="125" fill="none" stroke="#dae5db" stroke-width="1"/></svg>`;return `<div class="layout mode-orbit"><div class="mast"><h1>有我在，连接一切。</h1><p>AI 会为你们组织需要的功能</p></div><div class="network">${lines}<button class="node n1" data-detail="memory"><span class="nicon">◌</span>共同记忆</button><button class="node n2" data-detail="date"><span class="nicon">✳</span>约会</button><button class="node n3" data-detail="surprise"><span class="nicon">✦</span>惊喜</button><button class="node n4" data-detail="wishlist"><span class="nicon">◇</span>心愿</button><button class="core" data-act="chat"><strong>AI</strong><small>点我，说需求</small></button></div><p class="footnote">${esc(moodHint())}</p><button class="ask" data-act="chat"><span>有什么想一起完成的？</span>${icon('arrow')}</button></div>`}
function renderSplit(){return `<div class="layout mode-split"><div class="splithead"><span>YOU & ME</span><span>生活双人频道 · 演示</span></div><div class="lanes"><div class="lane left"><div class="avatar">你</div><div class="name">你的频道</div><h2>慢一点，<br>也很好。</h2><div class="ghost">01</div></div><div class="lane right"><div class="avatar">TA</div><div class="name">TA 的频道</div><h2>一起去<br>看看世界。</h2><div class="ghost">02</div></div></div><button class="connector" data-act="chat" aria-label="让 AI 协调两人需求"><span>∞</span></button><div class="bottom-sheet"><div class="eyebrow">OUR SHARED RHYTHM</div><h3>${state.avoidCrowds?'我想到一个不拥挤的约会。':'你们的不同，我来帮忙协调。'}</h3><button data-act="chat"><span>让 AI 安排一下</span>${icon('arrow')}</button><div class="more">两个人的偏好，只在允许时共享</div></div></div>`}
function renderPaper(){return `<div class="layout mode-paper"><div class="paperhead"><span>TOGETHER / VOL. 01</span><small>notes for two</small></div><div class="bigtitle"><span class="category">A LITTLE LOVE LETTER FROM AI</span><h1>把日子，<br>过成我们。</h1><div class="thin"><i></i> 今天的灵感，由 AI 挑选</div></div><div class="spread"><div class="stamp">EVERYDAY, TOGETHER</div><div class="over">little things,<br>big love.</div></div><div class="paperline"><span>${state.avoidCrowds?'去安静的地方':'本周的约会提案'}</span><button data-detail="date">翻开看看 ${icon('chevron','small')}</button></div><div class="footer"><button data-act="chat"><span>把你们的想法告诉 AI</span>${icon('arrow')}</button></div></div>`}
const renderers=[renderTalk,renderCanvas,renderOrbit,renderSplit,renderPaper];
function render(){renderStudio();document.getElementById('scene').innerHTML=renderers[current]();renderOverlay()}
const detailText={date:{title:'周末约会',label:'约会规划',copy:()=>state.avoidCrowds?'你提过不喜欢人多。这个提案会优先照顾安静、轻松的节奏。':'这是一份轻松的周末提案。告诉 AI 你们的喜好，它会更新下一次建议。',steps:()=>state.avoidCrowds?['选一家安静的咖啡小馆','傍晚沿着河边散步']:['挑一个让两个人都舒服的地点','留一点时间给随意散步']},surprise:{title:'今天的小惊喜',label:'惊喜策划',copy:()=>state.likesCoffee?'根据演示偏好，我想到一份不张扬的咖啡小惊喜。':'根据你们的使用反馈，惊喜可以更贴近你们的日常。',steps:()=>['挑一件对方最近喜欢的小事','挑一个意想不到的时刻']},memory:{title:'共同记忆',label:'关系记忆',copy:()=>state.avoidCrowds?'演示记忆：你不喜欢人多。下一次约会建议会避开拥挤场景。':'演示档案还很简单。用 AI 聊天告诉我偏好，我会在本机演示中记住。',steps:()=>['聊天中告诉 AI 喜欢或不喜欢什么','下次再来，让推荐随之改变']},wishlist:{title:'一起完成的心愿',label:'心愿清单',copy:()=> '把一个愿望交给 AI。它会根据情境选择计划、提醒或其他模块，而不要求你在每个功能里重新填表。',steps:()=>['说出你们想完成的事','让 AI 组织简单的第一步']}};
function openDetail(k){detailKey=k in detailText?k:'date';modal='detail';renderOverlay()}
function chat(){modal='chat';renderOverlay();setTimeout(()=>document.getElementById('aiText')?.focus(),80)}
function push(q){q=String(q||'').trim().slice(0,240);if(!q)return;state.messages.push({who:'you',text:q});const crowd=/(不喜欢|讨厌|不想|避免|避开|人多|拥挤|吵闹|清静|安静)/.test(q)&&/(人多|拥挤|吵闹|清静|安静)/.test(q);const forget=/(忘记.*人多|不再介意人多|可以去热闹|别避开人群)/.test(q);let reply='',intent='date';if(forget){state.avoidCrowds=false;reply='收到。关于人多的限制已经取消，下次我会重新考虑。';intent='memory'}else if(crowd){state.avoidCrowds=true;reply='记住了。下次安排约会，我会避开拥挤的地方。';intent='memory'}else if(/(咖啡|拿铁)/.test(q)&&/(不喝|不爱|讨厌)/.test(q)){state.likesCoffee=false;reply='好的，咖啡不再作为默认推荐。';intent='memory'}else if(/(喜欢|爱喝).*(咖啡|拿铁)/.test(q)){state.likesCoffee=true;reply='记住了：你喜欢咖啡。以后想准备惊喜时，我会参考它。';intent='memory'}else if(/(惊喜|礼物|生日|纪念日)/.test(q)){intent='surprise';reply=state.likesCoffee?'我想用你们喜欢的小细节，做一份轻轻的惊喜。':'我可以从你们的共同爱好里找惊喜灵感。'}else if(/(心愿|愿望|想完成|一起做)/.test(q)){intent='wishlist';reply='我先把这个想法整理成一个容易开始的行动。'}else if(/(回忆|以前|第一次见面)/.test(q)){intent='memory';reply='有些回忆值得好好放着。我会帮你们整理，但先只保留你愿意分享的部分。'}else{intent='date';reply=state.avoidCrowds?'我记得你不喜欢人多。先从安静的小店和散步开始，好吗？':'我先整理一个轻松的约会方向。你可以告诉我哪些更适合你们。'}state.messages.push({who:'ai',text:reply,intent});state.lastIntent=intent;store();renderSceneOnly();renderOverlay();setTimeout(()=>{const el=document.getElementById('modalScroll');if(el)el.scrollTop=el.scrollHeight},30)}
function renderSceneOnly(){document.getElementById('scene').innerHTML=renderers[current]()}
function renderOverlay(){const el=document.getElementById('overlay');if(!modal){el.className='';el.setAttribute('aria-hidden','true');el.innerHTML='';return}el.className='open';el.setAttribute('aria-hidden','false');let body='',head='',sub='';if(modal==='chat'){head='和 AI 聊';sub='ONE PLACE, EVERYTHING';let msgs=state.messages.slice(-9);body=`<div id="modalScroll" class="modalbody"><div class="reply">想做什么，直接告诉我。<br>约会、惊喜、心愿或关系里的小事，我会帮你组织。</div>${msgs.map(m=>`<div class="reply ${m.who==='you'?'from-user':''}">${esc(m.text)}</div>${m.who==='ai'&&m.intent?`<div class="answer-card"><div><div class="mini-label">AI 已选择模块</div><h3>${esc(detailText[m.intent]?.title||'本次安排')}</h3><p>点开查看简洁方案</p></div><button data-detail="${m.intent}" aria-label="查看方案详情">${icon('arrow')}</button></div>`:''}`).join('')}</div><form class="chatbottom" id="chatForm"><input id="aiText" autocomplete="off" placeholder="试试：我不喜欢人多" maxlength="240" aria-label="告诉 AI 你的想法"><button type="submit" aria-label="发送消息">${icon('arrow')}</button></form>`}
else if(modal==='detail'){const d=detailText[detailKey];head=d.title;sub=d.label.toUpperCase();const steps=d.steps();body=`<div class="modalbody"><div class="detail-illustration"><span>MADE FOR TWO</span></div><p class="detail-copy">${esc(d.copy())}</p><div class="steps">${steps.map((s,i)=>`<div class="step"><b>0${i+1}</b><span>${esc(s)}</span></div>`).join('')}</div><button class="save" data-act="save">${state.saved.includes(detailKey)?'已收藏 ✓':'收藏这个方案 ♡'}</button><button class="save" style="background:#eae6f4;color:#6d589b;margin-top:9px" data-act="chat">让 AI 继续调整</button></div>`}
else if(modal==='favs'){head='喜欢的设计';sub='YOUR SELECTION';body=`<div class="modalbody">${state.favs.length?`<div class="favorite-list">${state.favs.map(i=>`<button data-pick="${i}">${labels[i]} <span>${icon('arrow')}</span></button>`).join('')}</div>`:'<p class="empty">还没收藏设计。先抽几张，看到喜欢的就点上面的 ♡。</p>'}<button class="save" data-act="copy" style="margin-top:20px">复制我的选择</button></div>`}
 el.innerHTML=`<div class="shade" data-act="close"></div><div class="panel"><div class="modalhead"><div><div class="eyebrow">${sub}</div><h2>${head}</h2></div><button data-act="close" aria-label="关闭详情">${icon('close')}</button></div>${body}</div>`}
function message(t){const prev=document.getElementById('notice');if(prev)prev.remove();const n=document.createElement('div');n.id='notice';n.textContent=t;n.style='position:absolute;z-index:60;bottom:90px;left:50%;transform:translateX(-50%);background:#29243de8;color:white;border-radius:30px;padding:12px 18px;font-size:12px;white-space:nowrap;box-shadow:0 12px 30px #0002';document.getElementById('device').append(n);setTimeout(()=>n.remove(),1800)}
document.addEventListener('click',e=>{const btn=e.target.closest('[data-act],[data-detail],[data-pick]');if(!btn)return;if(btn.hasAttribute('data-pick')){choose(Number(btn.dataset.pick));return}if(btn.hasAttribute('data-detail')){openDetail(btn.dataset.detail);return}switch(btn.dataset.act){case'draw':draw();break;case'fav':toggleFav();break;case'favs':modal='favs';renderOverlay();break;case'chat':chat();break;case'close':modal='';renderOverlay();break;case'save':if(!state.saved.includes(detailKey)){state.saved.push(detailKey);store()}message('已收藏到本机');renderOverlay();break;case'copy':{const text=state.favs.length?state.favs.map(i=>labels[i]).join('、'):'暂时没有收藏';if(navigator.clipboard?.writeText){navigator.clipboard.writeText('情侣 AI 手机 UI 样本，我喜欢：'+text).then(()=>message('已复制')).catch(()=>message(text))}else message(text);break}}});
document.addEventListener('submit',e=>{if(e.target.id!=='chatForm')return;e.preventDefault();const input=document.getElementById('aiText');push(input?.value)});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&modal){modal='';renderOverlay()}else if(e.key==='ArrowRight'&&!modal&&!e.target.matches('input'))draw()});
render();
})();
</script>
</body>
</html>
