.lab-actions{height:77px;width:min(430px,100%);display:flex;gap:9px;align-items:center;padding:0 17px;flex-shrink:0}.rating-button{height:51px;flex:1;border-radius:16px;font-size:13px;font-weight:800;display:flex;align-items:center;justify-content:center;gap:9px;border:1px solid #e9deee;background:#fff;box-shadow:0 5px 15px #6c4b7a0b}.rating-button.primary{background:#524363;color:#fff;border-color:#524363;flex:1.2}.rating-button.liked{background:#f9e5eb;color:#ba738c;border-color:#f4d5e0}.rating-button .ic{width:17px;height:17px}

.chat-modal{height:min(85dvh,720px)}.chat-stream{overflow-y:auto;flex:1;min-height:0;padding:20px 17px 10px;display:flex;flex-direction:column;gap:14px}.msg{max-width:89%;font-size:13px;line-height:1.72;padding:12px 15px;border-radius:18px;white-space:pre-line}.msg.ai{align-self:flex-start;background:#f6f2ff;border-radius:5px 18px 18px 18px;color:#55486d}.msg.me{align-self:flex-end;background:#8f79b4;color:#fff;border-radius:18px 5px 18px 18px}.msg-result{align-self:flex-start;max-width:96%;width:96%;background:#fff;border:1px solid #eee7f4;border-radius:18px;padding:14px 15px}.msg-result b{font-size:13px}.msg-result p{color:#8d8197;font-size:11px;margin:5px 0 12px}.msg-result button{border-radius:10px;background:#f4effa;color:#775d96;font-size:11px;padding:8px 12px;font-weight:800}.chat-input{display:flex;align-items:center;gap:9px;padding:12px 14px calc(13px + env(safe-area-inset-bottom));border-top:1px solid #f4eff8}.chat-input input{height:48px;background:#f7f3fb;border-radius:15px;border:1px solid #f1e9f6;outline:0;padding:0 14px;flex:1;min-width:0;font-size:13px;color:#41364e}.chat-input button{width:48px;height:48px;border-radius:15px;background:#826bb0;color:#fff;display:grid;place-items:center}.chat-input button .ic{width:21px;height:21px}.starter{display:flex;flex-wrap:wrap;gap:8px}.starter button{padding:9px 10px;border-radius:999px;border:1px solid #e9e2f4;background:#fff;color:#77688e;font-size:11px}.fav-list{display:grid;gap:9px}.favitem{border:1px solid #e9e4ef;border-radius:17px;display:flex;align-items:center;gap:12px;text-align:left;padding:12px 13px;width:100%}.favthumb{width:44px;height:47px;border-radius:12px;flex:0 0 44px}.favtxt{flex:1}.favtxt b{display:block;font-size:13px}.favtxt small{font-size:10px;color:#a093aa;margin-top:4px;display:block}.favitem .ic{color:#ad83a3}.copy-button{width:100%;border-radius:14px;background:#6e577f;color:white;padding:14px;font-size:12px;font-weight:750;margin-top:12px}.toast{position:fixed;z-index:100;bottom:  <symbol id="i-coffee" viewBox="0 0 24 24"><path d="M4 8h13v6a6 6 0 0 1-6 6h-1a6 6 0 0 1-6-6zM17 9h2a3 3 0 0 1 0 6h-2M3 22h17"/></symbol>
 <symbol id="i-message" viewBox="0 0 24 24"><path d="M20 12a8 8 0 0 1-8 8c-1.5 0-2.9-.4-4.1-1.1L3 21l1.4-4.7A8 8 0 1 1 20 12Z"/></symbol>
 <symbol id="i-book" viewBox="0 0 24 24"><path d="M4 4.5c5-1 8 0 8 2v14c0-2-3-3-8-2zM20 4.5c-5-1-8 0-8 2v14c0-2 3-3 8-2z"/></symbol>
 <symbol id="i-orbit" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><ellipse cx="12" cy="12" rx="11" ry="5" transform="rotate(-24 12 12)"/></symbol>
 <symbol id="i-star" viewBox="0 0 24 24"><path d="m12 2 3.2 6.5 7.2 1-5.2 5 .9 7.2-6.1-3.3-6.1 3.3.9-7.2-5.2-5 7.2-1Z"/></symbol>
</svg>
<div class="lab">
 <header class="lab-top"><div class="lab-name"><span class="lab-symbol"><svg class="ic ic-lg"><use href="#i-sparkles"/></svg></span><span>灵感抽卡 <span style="color:#b9acbf;font-weight:500">/</span> <span id="cardNumber" class="lab-meta">样本 01 · 05</span></span></div><button id="openSaved" class="saved-trigger" aria-label="打开收藏的设计"><svg class="ic ic-sm"><use href="#i-heart"/></svg><strong id="savedCount">0</strong></button></header>
 <main id="preview" class="preview-shell" aria-label="当前手机端界面设计预览"></main>
 <footer class="lab-actions"><button id="saveCard" class="rating-button"><svg class="ic"><use href="#i-heart"/></svg><span id="saveLabel">喜欢这张</span></button><button id="nextCard" class="rating-button primary"><svg class="ic"><use href="#i-refresh"/></svg><span>再抽一张</span></button></footer>
</div>
<div id="overlays"></div>
<script>
(()=>{
'use strict';
const ico=(name,extra='')=>`<svg class="ic ${extra}" aria-hidden="true"><use href="#i-${name}"/></svg>`;
const storeKey='couple-ai-draw-v04';
let state={likes:[],drawn:[],current:0,chat:[{from:'ai',text:'想做什么，都可以告诉我。'}],avoidCrowds:false,lovesCoffee:false,lastIntent:'date',lastSummary:'留一段时间给彼此',memory:[],savedIdeas:[]};
try{const raw=JSON.parse(localStorage.getItem(storeKey)||'null');if(raw&&typeof raw==='object'){state={...state,...raw};if(!Array.isArray(state.likes))state.likes=[];if(!Array.isArray(state.drawn))state.drawn=[];if(!Array.isArray(state.chat))state.chat=[{from:'ai',text:'想做什么，都可以告诉我。'}];}}catch(e){}
const designs=[
{id:0,name:'月光玻璃',line:'柔光 · 紫粉 · 安静',class:'v-glass',swatch:'linear-gradient(140deg,#e7dcff,#ffdfe7)',hello:'今天想一起',hello2:'做什么？',intro:'让两个人的日常更轻松'},
{id:1,name:'双人周刊',line:'纸页 · 杂志 · 克制',class:'v-magazine',swatch:'linear-gradient(140deg,#efeee7,#ddbacf)',hello:'今天，',hello2:'留给彼此。',intro:'把想做的事交给我'},
{id:2,name:'蜜桃气泡',line:'甜感 · 轻盈 · 软糯',class:'v-peach',swatch:'linear-gradient(140deg,#ffd6d7,#efbdea)',hello:'我们的今天，',hello2:'会很可爱。',intro:'一起收集生活的小惊喜'},
{id:3,name:'云端晴日',line:'雾蓝 · 留白 · 呼吸',class:'v-sky',swatch:'linear-gradient(140deg,#d8efff,#c4c9f0)',hello:'给今天',hello2:'留点好心情。',intro:'此刻，你们想做什么？'},
{id:4,name:'静谧手记',line:'奶油 · 自然 · 极简',class:'v-minimal',swatch:'linear-gradient(140deg,#e5e9de,#cfbfdc)',hello:'两个人，',hello2:'慢慢来。',intro:'生活中每件小事，都有回应'}
];
const moduleData={date:{title:'约会灵感',short:'一段刚刚好的时光',icon:'calendar',points:['低预算也能轻松相处','以两个人的节奏安排','可以告诉 AI 想修改什么']},gift:{title:'秘密惊喜',short:'藏一点小心意',icon:'gift',points:['回想对方说过的喜好','选择简单但有心意的方式','先规划，再决定是否执行']},food:{title:'今天吃点',short:'一起选个喜欢的',icon:'coffee',points:['按照口味和预算筛选','居家做饭或外出都可以','不需要反复填写喜好']},care:{title:'慢慢聊聊',short:'把心事说清楚',icon:'message',points:['先听听自己的感受','一起整理想表达的话','所有建议都由你决定是否采用']},memory:{title:'回忆胶囊',short:'收藏我们的小瞬间',icon:'book',points:['把今天值得记住的事留下','以后由 AI 帮你们重新整理','不经过同意不共享个人秘密']},space:{title:'专属小宇宙',short:'一个只属于我们的角落',icon:'orbit',points:['小宇宙是一个独立模块','可与回忆、故事、角色关联','其他生活功能不依赖它']},plan:{title:'共同计划',short:'把想法往前推进',icon:'calendar',points:['把愿望拆成小步骤','需要时联动日程与预算','随时可以交给 AI 修改']},story:{title:'我们的故事',short:'让回忆多一种表达',icon:'book',points:['从自愿提供的经历中取材','故事可以随共同经历延伸','不直接复制他人独特作品']}};
function currentMods(){const key=state.lastIntent;const dict={date:['date','gift'],gift:['gift','date'],food:['food','plan'],care:['care','memory'],memory:['memory','space'],space:['space','story'],plan:['plan','date']};return dict[key]||dict.date}
function labelOf(m){return moduleData[m]||moduleData.date}
function escaped(t){return String(t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function moduleCard(m,i){const d=labelOf(m);let subtitle=d.short;if(m==='date'&&state.avoidCrowds)subtitle='安静、不拥挤的路线';if(m==='date'&&state.lovesCoffee)subtitle='一起去喝杯咖啡';if(m==='food'&&state.lovesCoffee)subtitle='从喜欢的咖啡开始';return `<button class="mod" data-module="${m}" aria-label="查看${d.title}详情"><span class="mod-art">${ico(d.icon)}</span><div><div class="mod-title">${escaped(d.title)}</div><div class="mod-sub">${escaped(subtitle)}</div></div></button>`}
function profile(){return `<button class="profile" data-profile="true" aria-label="查看我们的小档案"><span class="profile-illu">${ico('heart','ic-lg')}</span><span class="profile-txt"><b>我们的小档案</b><small>${state.avoidCrowds?'喜欢安静': '正在慢慢了解你们'}${state.lovesCoffee?' · 咖啡爱好者':''}</small></span><span class="arr">${ico('chevron','ic-sm')}</span></button>`}
function render(){const d=designs[state.current];const mods=currentMods();const dom=`<div class="variant ${d.class}"><div class="app-scroll"><div class="vhead"><span class="vbrand">好好在一起<span style="font-size:9px;color:var(--shine);margin-left:6px;font-weight:800">AI</span></span><div class="vavatars"><span class="vavatar">你</span><span class="vavatar">TA</span></div></div><div class="ai-hero"><span class="orb"></span><span class="spark s1"></span><span class="spark s2"></span><span class="spark s3"></span>${d.class==='v-sky'?'<span class="sky-cloud"></span>':''}<div class="ai-kicker">TOGETHER, EVERY DAY</div><h1 class="ai-head">${d.hello}<br>${d.hello2}</h1><div class="ai-foot">${d.intro}</div></div><div class="section-line"><b>只属于我们</b><span>${ico('chevron','ic-sm')}</span></div>${profile()}<div class="section-line"><b>AI 为你们准备</b><button data-all="true" style="font-size:10px;color:var(--mut);padding:4px 0">全部 ${ico('chevron','ic-sm')}</button></div><div class="module-row">${mods.map(moduleCard).join('')}</div></div><button class="chat-dock" data-chat="true" aria-label="与 AI 开始对话"><span class="dock-orb"></span><span class="dock-text">想做什么，告诉 AI…</span><span class="dock-send">${ico('arrow-up')}</span></button></div>`;
const root=document.getElementById('preview');root.innerHTML=dom;root.classList.remove('swap');void root.offsetWidth;root.classList.add('swap');document.getElementById('cardNumber').textContent=`样本 ${String(d.id+1).padStart(2,'0')} · 05`;
const saved=state.likes.includes(state.current);document.getElementById('saveCard').classList.toggle('liked',saved);document.getElementById('saveLabel').textContent=saved?'已收藏':'喜欢这张';document.getElementById('savedCount').textContent=state.likes.length;}
function persist(){try{localStorage.setItem(storeKey,JSON.stringify(state))}catch(e){}}
function toast(message){document.querySelector('.toast')?.remove();const t=document.createElement('div');t.className='toast';t.textContent=message;document.body.appendChild(t);setTimeout(()=>t.remove(),1600)}
function draw(){if(state.drawn.length>=designs.length)state.drawn=[];let options=designs.map(x=>x.id).filter(x=>!state.drawn.includes(x));if(options.length>1)options=options.filter(x=>x!==state.current);const pick=options[Math.floor(Math.random()*options.length)];state.current=pick;state.drawn.push(pick);persist();render()}
function like(){const index=state.likes.indexOf(state.current);if(index>=0){state.likes.splice(index,1);toast('已取消收藏')}else{state.likes.push(state.current);toast('已收藏这张设计')}persist();render()}
function openModal(title,content,opts={}){document.getElementById('overlays').innerHTML=`<div class="veil" id="veil"><section class="modal ${opts.className||''}" role="dialog" aria-modal="true" aria-label="${escaped(title)}"><div class="modal-head"><h3>${escaped(title)}</h3><button class="x-btn" id="closeModal" aria-label="关闭">${ico('close')}</button></div>${content}</section></div>`;document.getElementById('veil').addEventListener('click',e=>{if(e.target.id==='veil')closeModal()});document.getElementById('closeModal').addEventListener('click',closeModal)}
function closeModal(){document.getElementById('overlays').innerHTML=''}
function moduleDetail(key){const x=labelOf(key);let extra='';if(key==='date'&&state.avoidCrowds)extra='<div class="detail-point">🌿 已考虑你说过的「不喜欢人多」</div>';if(key==='date'&&state.lovesCoffee)extra+='<div class="detail-point">☕ 把你喜欢的咖啡安排进计划</div>';openModal(x.title,`<div class="modal-content"><div class="sheet-icon">${ico(x.icon,'ic-lg')}</div><h2 class="detail-title">${x.title}</h2><p class="detail-par">${escaped(x.short)}。这是 AI 为你们整理的模块信息，具体决定仍由你们做。</p><div class="detail-points">${extra}${x.points.map((t,i)=>`<div class="detail-point"><small>0${i+1}</small>${escaped(t)}</div>`).join('')}</div><button class="modal-action" id="askOnModule">和 AI 继续聊这件事</button><div class="sheet-note">演示版：所有内容由本地规则生成，不代表真实模型推理。</div></div>`);document.getElementById('askOnModule').addEventListener('click',()=>{closeModal();openChat('想聊聊'+x.title)})}
function profileDetail(){openModal('我们的小档案',`<div class="modal-content"><div class="sheet-icon">${ico('heart','ic-lg')}</div><h2 class="detail-title">慢慢了解你们</h2><p class="detail-par">不需要一次填完。你说过的偏好，会在下一次相关建议里起作用。</p><div class="detail-points"><div class="detail-point"><small>已记录的偏好</small>${state.avoidCrowds?'避开人多的地方':'暂时没有特别限制'}${state.lovesCoffee?' · 喜欢咖啡':''}</div><div class="detail-point"><small>控制权</small>想修改或清除，直接告诉 AI。</div></div><button class="modal-action" id="askOnProfile">和 AI 说说我的偏好</button><div class="sheet-note">演示资料仅保存到当前浏览器，可用对话“清除偏好”重置。</div></div>`);document.getElementById('askOnProfile').addEventListener('click',()=>{closeModal();openChat()})}
function allModules(){const all=Object.keys(moduleData);openModal('功能灵感',`<div class="modal-content"><p class="muted" style="margin:0 0 16px">这些是 AI 可以调度的模块，不需要分别填表。</p><div class="module-row">${all.map(moduleCard).join('')}</div><div class="sheet-note">用户可以直接点开查看，但主要操作依然是和 AI 对话。</div></div>`)}
function savedScreen(){const rows=state.likes.map(i=>{const d=designs[i];return `<button class="favitem" data-select="${i}"><span class="favthumb" style="background:${d.swatch}"></span><span class="favtxt"><b>${d.name}</b><small>${d.line}</small></span>${ico('chevron')}</button>`}).join('');openModal('喜欢的设计',`<div class="modal-content"><div class="fav-list">${rows||'<p class="muted" style="padding:20px 2px">还没有收藏。抽到喜欢的就按一下爱心。</p>'}</div>${state.likes.length?'<button class="copy-button" id="copyPrefs">复制我的选择</button>':''}<p class="muted" style="margin:14px 0 0">收藏会保存在这台设备的浏览器里。</p></div>`);document.getElementById('copyPrefs')?.addEventListener('click',()=>{const list=state.likes.map(i=>designs[i].name).join('、');const text=`情侣 AI 手机 UI 抽卡 V0.4：我喜欢 ${list}。请结合这些设计继续迭代。`;if(navigator.clipboard?.writeText){navigator.clipboard.writeText(text).then(()=>toast('已复制喜欢的方案')).catch(()=>{toast(text)})}else{const t=document.createElement('textarea');t.value=text;document.body.append(t);t.select();document.execCommand('copy');t.remove();toast('已复制')}})}
function setIntentFromMessage(raw){let q=raw.trim();if(!q)return null;let note='';let changed=false;if(/清除偏好|忘记偏好|删除偏好|重置记忆/.test(q)){state.avoidCrowds=false;state.lovesCoffee=false;changed=true;note='已清除这份演示偏好。';}
else{
if(/不喜欢人多|不想去人多|别去人多|讨厌拥挤|不喜欢拥挤|避开人多/.test(q)){state.avoidCrowds=true;changed=true;note='记下了：以后推荐约会，优先考虑清静的地方。';}
if(/喜欢咖啡|爱喝咖啡|想喝咖啡/.test(q)){state.lovesCoffee=true;changed=true;note='记下了：你喜欢咖啡。';}}
let next=null;
if(/不开心|心情不好|吵架|生气|委屈|难过|误会|沟通/.test(q))next='care';
else if(/宇宙|星球|角色|空间|故事/.test(q))next='space';
else if(/回忆|纪念|照片/.test(q))next='memory';
else if(/惊喜|生日|礼物/.test(q))next='gift';
else if(/吃|餐厅|火锅|咖啡|饭|喝/.test(q))next='food';
else if(/计划|愿望|目标/.test(q))next='plan';
else if(/约会|周末|出去玩|出门|散步|旅行/.test(q))next='date';
if(next)state.lastIntent=next;
if(changed&&!next){return {text:note||'记住了。下次我会参考你的选择。',intent:null}}
const map={date:'已经为你们整理了一份轻松的约会方向。',gift:'我帮你藏了一点小惊喜。',food:'把选择变简单，一起挑个喜欢的。',care:'可以慢慢说，我先陪你整理思路。',memory:'把这段记忆好好收起来。',space:'想看看属于你们的那个小角落吗？',plan:'从一个小步骤开始就好。'};
return {text:(note?note+'\n':'')+(map[state.lastIntent]||map.date),intent:state.lastIntent};}
function processInput(q){const input=q.trim();if(!input)return;state.chat.push({from:'me',text:input});const result=setIntentFromMessage(input);if(result){state.chat.push({from:'ai',text:result.text,detail:result.intent})}if(state.chat.length>24)state.chat=state.chat.slice(-24);persist();render();renderChat();}
function chatMarkup(){return `<div class="chat-stream" id="chatStream">${state.chat.map(m=>m.from==='me'?`<div class="msg me">${escaped(m.text)}</div>`:`<div class="msg ai">${escaped(m.text)}</div>${m.detail?`<div class="msg-result"><b>${escaped(labelOf(m.detail).title)}</b><p>${escaped(labelOf(m.detail).short)}</p><button data-detail="${m.detail}">查看结果 ${ico('next','ic-sm')}</button></div>`:''}`).join('')}</div><form class="chat-input" id="chatForm"><input id="chatText" autocomplete="off" aria-label="对 AI 说话" placeholder="直接告诉我你的想法…"><button type="submit" aria-label="发送">${ico('arrow-up')}</button></form>`}
function renderChat(){const body=document.querySelector('#overlays .modal');if(!body)return;const form=body.querySelector('#chatForm');if(!form)return;const stream=body.querySelector('#chatStream');stream.innerHTML=state.chat.map(m=>m.from==='me'?`<div class="msg me">${escaped(m.text)}</div>`:`<div class="msg ai">${escaped(m.text)}</div>${m.detail?`<div class="msg-result"><b>${escaped(labelOf(m.detail).title)}</b><p>${escaped(labelOf(m.detail).short)}</p><button data-detail="${m.detail}">查看结果 ${ico('next','ic-sm')}</button></div>`:''}`).join('');stream.scrollTop=stream.scrollHeight;}
function openChat(prefill=''){openModal('和 AI 说说',chatMarkup(),{className:'chat-modal'});const form=document.getElementById('chatForm');const input=document.getElementById('chatText');form.addEventListener('submit',e=>{e.preventDefault();const value=input.value;input.value='';processInput(value)});if(prefill)input.value=prefill;const stream=document.getElementById('chatStream');stream.scrollTop=stream.scrollHeight;setTimeout(()=>input.focus({preventScroll:true}),70)}
document.getElementById('preview').addEventListener('click',e=>{let btn=e.target.closest('button');if(!btn)return;if(btn.dataset.chat)openChat();else if(btn.dataset.profile)profileDetail();else if(btn.dataset.module)moduleDetail(btn.dataset.module);else if(btn.dataset.all)allModules()});
document.getElementById('overlays').addEventListener('click',e=>{let btn=e.target.closest('button');if(!btn)return;if(btn.dataset.detail){closeModal();moduleDetail(btn.dataset.detail)}if(btn.dataset.select!==undefined){state.current=Number(btn.dataset.select);persist();closeModal();render()};if(btn.dataset.module){closeModal();moduleDetail(btn.dataset.module)}});
document.getElementById('nextCard').addEventListener('click',draw);document.getElementById('saveCard').addEventListener('click',like);document.getElementById('openSaved').addEventListener('click',savedScreen);document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
if(!state.drawn.includes(state.current))state.drawn.push(state.current);render();
})();
</script>
</body>
</html>
